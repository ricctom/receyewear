<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Proveedores · REC Eyewear</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="panel.css"/>
<style>
  .mov{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln)}
  .mov:last-child{border-bottom:none}
  .mov .izq{min-width:0}
  .mov .q{font-size:14.5px;font-weight:500;margin:0}
  .mov .f{font-size:12.5px;color:var(--mt);margin:3px 0 0}
  .mov .d{font-size:12.5px;color:var(--md);margin:5px 0 0;line-height:1.55}
  .mov .der{text-align:right;white-space:nowrap}
  .mov .mm{font-size:15.5px;font-weight:600}
  .mov .mm.sube{color:var(--no)} .mov .mm.baja{color:var(--ok)}
  .mov .ss{font-size:12.5px;color:var(--mt);margin-top:2px}
  .mov .x{background:none;border:none;color:var(--ln2);font-size:16px;padding:0 0 0 8px;align-self:center}
  .mov .x:hover{color:var(--no)}
  .caja{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:6px 24px;margin-bottom:14px}
  .cabe{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 11px;
    border-bottom:1px solid var(--ln);margin-bottom:2px}
  .cabe h3{margin:0;font-size:15.5px;font-weight:600}
  .cabe .n{font-size:16px;font-weight:600}
  .plegar{background:none;border:none;color:var(--md);font-size:13.5px;padding:13px 0;width:100%;text-align:left}
  .plegar:hover{color:var(--tx)}
  .lectura{background:var(--azbg);border-radius:14px;padding:15px 18px;margin-bottom:20px;
    font-size:14px;color:#2c4d70;line-height:1.65}
  .stk{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
  .stk:last-child{border-bottom:none}
  .stk .g{color:var(--mt);font-size:13px}
  /* El detalle de todos los proveedores, arriba de todo */
  .provs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .prov{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:15px 20px;
    min-width:180px;text-align:left;flex:1}
  .prov:hover{border-color:var(--ln2)}
  .prov.on{border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}
  .prov .pn{font-size:14px;color:var(--md);margin:0 0 5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .prov .pm{font-size:24px;font-weight:600;letter-spacing:-.6px;margin:0}
  .prov .pm.debe{color:var(--no)}
  .prov .pm.ok{color:var(--ok)}
  .prov .pe{font-size:12.5px;color:var(--mt);margin:4px 0 0}
  .prov .llave{font-size:11px;background:var(--okbg);color:var(--ok);border-radius:20px;padding:2px 9px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>REC</h1>
  <nav class="tabs" id="nav">
    <a href="admin.html">Pedidos</a>
    <a href="crm.html">Clientes</a>
    <a href="proveedor.html" class="on">Proveedores</a>
  </nav>
  <div class="who" id="who"></div>
</header>

<div class="wrap" id="gate">
  <div class="gate">
    <h2>Cuenta corriente</h2>
    <p>Entrá con tu cuenta de Google.</p>
    <div id="gbtn"></div>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<div class="wrap" id="panel" style="display:none">
  <div id="lecturaAviso"></div>
  <div class="top">
    <div>
      <h2 id="titulo">Proveedores</h2>
      <div class="sub" id="subtitulo"></div>
    </div>
    <div class="der" id="acciones"></div>
  </div>
  <div class="provs" id="provs"></div>
  <div id="cuerpo"></div>
</div>

<div class="modal-ov" id="ov" onclick="cerrarModal()"></div>
<div class="modal" id="modal"><div id="modalBody"></div></div>

<script src="panel.js"></script>
<script>
let D = null, filas = [], verTodo = false, verConsig = false, verMovCons = false, verPrecios = false;
let elegido = null;   // qué proveedor se está mirando
const INVITACION = new URLSearchParams(location.search).get('invitacion') || '';

// Cada proveedor lleva su cuenta en su moneda.
const plata = (monto, moneda) => moneda === 'USD' ? usd(monto) : fmt(monto);

async function cargar(){
  try{
    const qs = [];
    if(INVITACION) qs.push('invitacion=' + encodeURIComponent(INVITACION));
    if(elegido) qs.push('proveedor=' + elegido);
    D = await api('/api/proveedor' + (qs.length ? '?' + qs.join('&') : ''));
    // El token no queda pegado en la barra de direcciones ni en el historial.
    if(INVITACION) history.replaceState(null, '', location.pathname);
    if(D.reciénEntró) showToast('¡Listo! Esta cuenta quedó registrada.');
    elegido = D.proveedor.id;
    pintar();
  }catch(e){
    document.getElementById('panel').style.display = 'block';
    document.getElementById('cuerpo').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

function pintar(){
  const ro = D.soloLectura;
  const rate = Number((D.usd && D.usd.valor) || 0);
  const P = D.proveedor;
  const esUSD = P.moneda === 'USD';

  document.getElementById('lecturaAviso').innerHTML = ro
    ? `<div class="lectura">Hola ${esc(session.user.name||'')}. Acá está la cuenta que llevamos con REC Eyewear:
       el saldo, todos los movimientos, lo que está en consignación y la lista de precios.
       Entrá cuando quieras desde este mismo link. Los movimientos los carga Tomás; si ves algo
       que no cierra, avisale.</div>` : '';
  if(ro) document.getElementById('nav').innerHTML = '<a href="proveedor.html" class="on">Cuenta corriente</a>';

  document.getElementById('titulo').textContent = ro ? 'Cuenta corriente' : 'Proveedores';
  document.getElementById('subtitulo').textContent = ro
    ? D.movimientos.length + ' movimientos'
    : D.proveedores.length + (D.proveedores.length === 1 ? ' proveedor' : ' proveedores') +
      ' · mirando la cuenta de ' + P.nombre;

  document.getElementById('acciones').innerHTML = ro ? '' : `
    <button class="b sm" onclick="modalPago()">Le pagué</button>
    <button class="b sm q" onclick="modalEntrega()">Cargar entrega</button>
    <button class="b sm q ico" onclick="masOpciones()" title="Más">⋯</button>`;

  // Arriba: todos los proveedores con lo que les debés
  document.getElementById('provs').innerHTML = D.proveedores.map(p => `
    <button class="prov ${p.id===P.id?'on':''}" onclick="verProveedor(${p.id})">
      <p class="pn">${esc(p.nombre)}${p.tiene_acceso ? '<span class="llave">entra solo</span>' : ''}</p>
      <p class="pm ${p.saldo > 0 ? 'debe' : 'ok'}">${p.saldo ? plata(p.saldo, p.moneda) : 'al día'}</p>
      <p class="pe">${p.saldo
        ? (p.moneda === 'USD' && rate ? 'le debés · son ' + fmt(p.saldo * rate) : 'le debés')
        : 'no le debés nada'}</p>
    </button>`).join('')
    + (ro ? '' : `<button class="prov" style="min-width:auto;flex:0 0 auto;color:var(--md)" onclick="modalNuevoProv()">
        <p class="pn">+ Proveedor</p><p class="pe">agregar otro</p></button>`);

  const movs = verTodo ? D.movimientos : D.movimientos.slice(0, 8);
  document.getElementById('cuerpo').innerHTML = `
    <div class="caja">
      <div class="cabe"><h3>${ro ? 'Movimientos' : 'Cuenta de ' + esc(P.nombre)}</h3>
        <span class="n">${plata(D.deuda, P.moneda)}${
          esUSD && rate ? ` <span style="font-size:12.5px;font-weight:400;color:var(--mt)">· ${fmt(D.deuda * rate)}</span>` : ''}</span></div>
      ${movs.map(m => renderMov(m, ro, P.moneda)).join('')
        || '<div class="empty">Todavía no hay movimientos con ' + esc(P.nombre) + '.</div>'}
      ${D.movimientos.length > 8 ? `<button class="plegar" onclick="verTodo=!verTodo;pintar()">
        ${verTodo ? 'Ver solo los últimos' : 'Ver los ' + D.movimientos.length + ' movimientos'}</button>` : ''}
    </div>

    ${D.stock_consignacion.length ? `<div class="caja">
      <div class="cabe"><h3>${ro ? 'Mercadería tuya en consignación' : 'En consignación'}</h3>
        <span class="n">${plata(D.consign_total, P.moneda)}</span></div>
      ${verConsig ? D.stock_consignacion.map(a => `<div class="stk">
        <span>${esc(a.articulo)} <span class="g">${a.cantidad} u.</span></span>
        <span class="num">${plata(a.total, P.moneda)}</span></div>`).join('') : ''}
      <button class="plegar" onclick="verConsig=!verConsig;pintar()">
        ${verConsig ? 'Ocultar' : (ro ? 'Ver qué le dejaste' : 'Ver qué tenés de él')}</button>
    </div>` : ''}

    ${D.consignacion.length ? `<div class="caja">
      <div class="cabe"><h3>Movimientos de consignación</h3></div>
      ${verMovCons ? D.consignacion.map(c => `<div class="mov">
        <div class="izq"><p class="q">${esc(c.articulo)}</p>
          <p class="f">${fechaCorta(c.fecha)}${c.nota ? ' · ' + esc(c.nota) : ''}</p></div>
        <div style="display:flex;align-items:center">
          <div class="der">
            <div class="mm ${c.cantidad > 0 ? 'sube' : 'baja'}">${c.cantidad > 0 ? '+' : ''}${c.cantidad} u.</div>
            <div class="ss num">${plata(c.cantidad * Number(c.precio), P.moneda)}</div>
          </div>
          ${ro ? '' : `<button class="x" onclick="borrar('borrarConsign',${c.id})">×</button>`}
        </div></div>`).join('') : ''}
      <button class="plegar" onclick="verMovCons=!verMovCons;pintar()">
        ${verMovCons ? 'Ocultar' : 'Ver los ' + D.consignacion.length + ' movimientos'}</button>
    </div>` : ''}

    <div class="caja">
      <div class="cabe"><h3>Lista de precios</h3>
        ${ro ? '' : '<button class="b sm q" onclick="modalPrecios()">Editar</button>'}</div>
      ${verPrecios ? (D.precios.length
        ? D.precios.map(pr => `<div class="stk"><span>${esc(pr.articulo)}</span>
            <span class="num">${plata(Number(pr.precio), P.moneda)}</span></div>`).join('')
        : '<div class="empty">Todavía no cargaste precios de ' + esc(P.nombre) + '.</div>') : ''}
      <button class="plegar" onclick="verPrecios=!verPrecios;pintar()">
        ${verPrecios ? 'Ocultar' : (D.precios.length ? 'Ver los ' + D.precios.length + ' artículos' : 'Cargar precios')}</button>
    </div>`;
}

function verProveedor(id){
  elegido = id; verTodo = false; verConsig = false; verMovCons = false; verPrecios = false;
  cargar();
}

function renderMov(m, ro, moneda){
  const sube = m.monto > 0;
  const items = (m.items || []).map(i => `${i.cantidad}× ${i.articulo}`).join(' · ');
  // Cada uno lo lee desde su lado.
  const que = m.tipo === 'AJUSTE' ? 'Ajuste'
    : sube ? (ro ? 'Le entregaste mercadería' : 'Te entregó mercadería')
           : (ro ? 'Te pagó' : 'Le pagaste');
  return `<div class="mov">
    <div class="izq">
      <p class="q">${que}</p>
      <p class="f">${fechaCorta(m.fecha)}${m.detalle ? ' · ' + esc(m.detalle) : ''}</p>
      ${items ? `<p class="d">${esc(items)}</p>` : ''}
    </div>
    <div style="display:flex;align-items:center">
      <div class="der">
        <div class="mm ${sube?'sube':'baja'}">${sube?'+':''}${plata(m.monto, moneda)}</div>
        <div class="ss num">saldo ${plata(m.saldo, moneda)}</div>
      </div>
      ${ro ? '' : `<button class="x" title="Borrar" onclick="borrar('borrarMov',${m.id})">×</button>`}
    </div>
  </div>`;
}

const unidad = () => D.proveedor.moneda === 'USD' ? 'dólares' : 'pesos';
async function post(body){
  return api('/api/proveedor', { method:'POST',
    body: JSON.stringify(Object.assign({ supplier_id: D.proveedor.id }, body)) });
}

/* ---------- pago ---------- */
function modalPago(){
  abrirModal(`<h3>Le pagué a ${esc(D.proveedor.nombre)}</h3>
    <p class="sub">Le debés <b>${plata(D.deuda, D.proveedor.moneda)}</b>.</p>
    <div class="fila">
      <div><label>Monto en ${unidad()}</label><input type="number" step="0.01" id="pMonto" placeholder="${D.deuda}"></div>
      <div><label>Cuándo</label><input type="date" id="pFecha" value="${hoyISO()}"></div>
    </div>
    <label>Nota</label><input type="text" id="pDet" placeholder="Transferencia, efectivo…">
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarPago()">Registrar</button></div>`);
}
async function guardarPago(){
  const monto = Number(document.getElementById('pMonto').value);
  if(!(monto > 0)) return alert('Poné cuánto le pagaste.');
  try{
    await post({ fecha: document.getElementById('pFecha').value,
      pago:{ monto, detalle: document.getElementById('pDet').value } });
    cerrarModal(); showToast('Pago registrado'); await cargar();
  }catch(e){ alert(e.message); }
}

/* ---------- entrega suelta ---------- */
function modalEntrega(){
  filas = [{ articulo:'', cantidad:'', precio:'' }];
  abrirModal(`<h3>Entrega de ${esc(D.proveedor.nombre)}</h3>
    <p class="sub">Lo que te trae fuera de un pedido. Las entregas contra pedido entran solas
      cuando confirmás que llegaron, desde la pantalla de Pedidos.</p>
    <div class="fila"><div><label>Cuándo</label><input type="date" id="eFecha" value="${hoyISO()}"></div>
      <div><label>Nota</label><input type="text" id="eDet" placeholder="Reposición de mostrador…"></div></div>
    <label>Artículos</label><div id="filas"></div>
    <button class="b sm q" onclick="agregarFila()">+ Otro artículo</button>
    <div class="qtot"><span>Total</span><span id="fTot"></span></div>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarEntrega()">Sumar a la deuda</button></div>`);
  renderFilas();
}
function renderFilas(){
  document.getElementById('filas').innerHTML = filas.map((f,i) => `
    <div class="qrow" style="grid-template-columns:1fr 74px 92px 26px">
      <select onchange="elegirArt(${i},this.value)">
        <option value="">— artículo —</option>
        ${D.precios.map(p => `<option value="${esc(p.articulo)}"${f.articulo===p.articulo?' selected':''}>${esc(p.articulo)}</option>`).join('')}
      </select>
      <input type="number" placeholder="cant." value="${f.cantidad||''}" oninput="filas[${i}].cantidad=this.value;totalFilas()">
      <input type="number" step="0.01" placeholder="${D.proveedor.moneda==='USD'?'US$':'$'}" value="${f.precio||''}"
             oninput="filas[${i}].precio=this.value;totalFilas()">
      <button class="b q ico" style="height:32px;width:26px" onclick="filas.splice(${i},1);renderFilas()">×</button>
    </div>`).join('');
  totalFilas();
}
function elegirArt(i, art){
  filas[i].articulo = art;
  const p = D.precios.find(x => x.articulo === art);
  if(p && !filas[i].precio) filas[i].precio = Number(p.precio);
  renderFilas();
}
function agregarFila(){ filas.push({ articulo:'', cantidad:'', precio:'' }); renderFilas(); }
function totalFilas(){
  const t = filas.reduce((a,f) => a + (Number(f.cantidad)||0) * (Number(f.precio)||0), 0);
  const box = document.getElementById('fTot');
  if(box) box.textContent = plata(t, D.proveedor.moneda);
}
async function guardarEntrega(){
  const items = filas.filter(f => f.articulo && Number(f.cantidad) > 0);
  if(!items.length) return alert('Cargá al menos un artículo.');
  try{
    await post({ fecha: document.getElementById('eFecha').value,
      entrega:{ items, detalle: document.getElementById('eDet').value } });
    cerrarModal(); showToast('Sumado a la deuda'); await cargar();
  }catch(e){ alert(e.message); }
}

/* ---------- lo que casi nunca se toca ---------- */
function masOpciones(){
  abrirModal(`<h3>${esc(D.proveedor.nombre)}</h3>
    <p class="sub">Lo que se toca una vez cada tanto.</p>
    <button class="b" style="width:100%;margin-bottom:8px" onclick="modalConsignacion()">Mover consignación</button>
    <button class="b" style="width:100%;margin-bottom:8px" onclick="modalPrecios()">Lista de precios</button>
    <button class="b" style="width:100%;margin-bottom:8px" onclick="modalAjuste()">Ajuste de cuenta</button>
    <button class="b" style="width:100%;margin-bottom:8px" onclick="modalAcceso()">Darle acceso a ${esc(D.proveedor.nombre)}</button>
    <button class="b" style="width:100%" onclick="modalDatos()">Nombre y moneda</button>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cerrar</button></div>`);
}

function modalConsignacion(){
  filas = [{ articulo:'', cantidad:'', precio:'' }];
  abrirModal(`<h3>Consignación</h3>
    <p class="sub">No entra en la cuenta corriente hasta que se la pagás.</p>
    <div class="fila"><div><label>Cuándo</label><input type="date" id="kFecha" value="${hoyISO()}"></div>
      <div><label>Qué pasó</label><select id="kTipo">
        <option value="deja">Me dejó mercadería</option>
        <option value="devuelvo">Se la devolví</option>
        <option value="pago">Me la quedo y se la pago</option></select></div></div>
    <label>Artículos</label><div id="filas"></div>
    <button class="b sm q" onclick="agregarFila()">+ Otro artículo</button>
    <div class="qtot"><span>Total</span><span id="fTot"></span></div>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarConsig()">Guardar</button></div>`);
  renderFilas();
}
async function guardarConsig(){
  const items = filas.filter(f => f.articulo && Number(f.cantidad) > 0);
  if(!items.length) return alert('Cargá al menos un artículo.');
  try{
    await post({ fecha: document.getElementById('kFecha').value,
      consignacion:{ tipo: document.getElementById('kTipo').value, items } });
    cerrarModal(); showToast('Guardado'); await cargar();
  }catch(e){ alert(e.message); }
}

function modalPrecios(){
  abrirModal(`<h3>Precios de ${esc(D.proveedor.nombre)}</h3>
    <p class="sub">Lo que te cobra por unidad, en ${unidad()}. De acá sale el costo de cada pedido.</p>
    ${D.precios.length ? D.precios.map((pr,i) => `<div class="qrow">
      <span class="qn">${esc(pr.articulo)}</span>
      <input type="number" step="0.01" id="pr${i}" value="${Number(pr.precio)}"
             onchange="guardarPrecio('${esc(pr.articulo).replace(/'/g,"\\'")}',${i})">
    </div>`).join('') : '<p class="sub">Todavía no hay ninguno.</p>'}
    <div class="mfoot"><button class="b q" onclick="modalNuevoArt()">+ Artículo</button>
    <button class="b p" style="flex:none" onclick="cerrarModal();cargar()">Listo</button></div>`);
}
async function guardarPrecio(articulo, i){
  const precio = Number(document.getElementById('pr'+i).value);
  if(!(precio > 0)) return alert('Precio inválido.');
  try{ await post({ precio:{ articulo, precio } }); showToast('Guardado'); }catch(e){ alert(e.message); }
}
function modalNuevoArt(){
  abrirModal(`<h3>Nuevo artículo de ${esc(D.proveedor.nombre)}</h3>
    <label>Nombre</label><input id="naNom" placeholder="ESTUCHE PERSONALIZADO">
    <label>Precio por unidad (${unidad()})</label><input type="number" step="0.01" id="naPre">
    <div class="mfoot"><button class="b q" onclick="modalPrecios()">Volver</button>
    <button class="b p" style="flex:none" onclick="guardarNuevoArt()">Guardar</button></div>`);
}
async function guardarNuevoArt(){
  const articulo = document.getElementById('naNom').value.trim();
  const precio = Number(document.getElementById('naPre').value);
  if(!articulo || !(precio > 0)) return alert('Completá nombre y precio.');
  try{ await post({ precio:{ articulo, precio } }); cerrarModal(); await cargar(); showToast('Agregado'); }
  catch(e){ alert(e.message); }
}

function modalAjuste(){
  abrirModal(`<h3>Ajuste de cuenta</h3>
    <p class="sub">Para cuadrar diferencias. Positivo sube la deuda, negativo la baja.</p>
    <div class="fila"><div><label>Monto (${unidad()})</label><input type="number" step="0.01" id="aMonto" placeholder="-50"></div>
      <div><label>Cuándo</label><input type="date" id="aFecha" value="${hoyISO()}"></div></div>
    <label>Por qué</label><input type="text" id="aDet" placeholder="Descuento, diferencia…">
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarAjuste()">Guardar</button></div>`);
}
async function guardarAjuste(){
  const monto = Number(document.getElementById('aMonto').value);
  if(!monto) return alert('El ajuste no puede ser cero.');
  try{
    await post({ fecha: document.getElementById('aFecha').value,
      ajuste:{ monto, detalle: document.getElementById('aDet').value } });
    cerrarModal(); showToast('Guardado'); await cargar();
  }catch(e){ alert(e.message); }
}

/* ---------- alta, datos y acceso ---------- */
function modalNuevoProv(){
  abrirModal(`<h3>Nuevo proveedor</h3>
    <p class="sub">Cada uno lleva su cuenta en su moneda.</p>
    <div class="fila">
      <div><label>Nombre</label><input id="npNom" placeholder="Fernando"></div>
      <div><label>Moneda</label><select id="npMon">
        <option value="ARS">Pesos</option><option value="USD">Dólares</option></select></div>
    </div>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarNuevoProv()">Crear</button></div>`);
}
async function guardarNuevoProv(){
  const nombre = document.getElementById('npNom').value.trim();
  if(!nombre) return alert('Poné el nombre.');
  try{
    const r = await post({ nuevo:{ nombre, moneda: document.getElementById('npMon').value } });
    cerrarModal(); elegido = r.id; await cargar(); showToast('Proveedor creado');
  }catch(e){ alert(e.message); }
}

function modalDatos(){
  abrirModal(`<h3>Datos de ${esc(D.proveedor.nombre)}</h3>
    <p class="sub">Si le cambiás la moneda, los montos ya cargados no se convierten: quedan como están.</p>
    <div class="fila">
      <div><label>Nombre</label><input id="pdNom" value="${esc(D.proveedor.nombre)}"></div>
      <div><label>Moneda</label><select id="pdMon">
        <option value="ARS"${D.proveedor.moneda==='ARS'?' selected':''}>Pesos</option>
        <option value="USD"${D.proveedor.moneda==='USD'?' selected':''}>Dólares</option></select></div>
    </div>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarDatos()">Guardar</button></div>`);
}
async function guardarDatos(){
  try{
    await post({ proveedor:{ nombre: document.getElementById('pdNom').value,
      moneda: document.getElementById('pdMon').value, email: D.proveedor.email || '' } });
    cerrarModal(); await cargar(); showToast('Guardado');
  }catch(e){ alert(e.message); }
}

function modalAcceso(){
  const nom = esc(D.proveedor.nombre);
  const link = D.proveedor.invitacion
    ? location.origin + '/proveedor.html?invitacion=' + D.proveedor.invitacion : '';
  abrirModal(`<h3>Acceso de ${nom}</h3>
    ${D.proveedor.email
      ? `<p class="sub">Ya entró con <b>${esc(D.proveedor.email)}</b>. Ve el saldo, los movimientos,
          la consignación y la lista de precios de su cuenta, sin poder tocar nada.
          No ve pedidos, ni clientes, ni las cuentas de los otros proveedores.</p>
         <div class="mfoot"><button class="b q mal" onclick="sacarAcceso()">Sacarle el acceso</button>
         <button class="b" onclick="cerrarModal()">Cerrar</button></div>`
      : link
        ? `<p class="sub">Mandale este link a ${nom}. <b>El primero que entre con Google por acá</b>
            queda registrado y el link deja de servir. Vos no lo quemás: si entrás con tu cuenta,
            el link lo sigue esperando a él.</p>
           <input id="svLink" value="${esc(link)}" readonly onclick="this.select()">
           <div class="mfoot">
             <button class="b q mal" onclick="revocarLink()">Dar de baja</button>
             <button class="b" onclick="mandarPorWhatsApp()">WhatsApp</button>
             <button class="b p" style="flex:none" onclick="copiarLink()">Copiar el link</button>
           </div>`
        : `<p class="sub">No hace falta que sepas su mail: generá un link, se lo mandás,
            y el primero que entre con Google por ese link queda registrado como ${nom}.</p>
           <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
           <button class="b p" style="flex:none" onclick="generarLink()">Generar el link</button></div>`}`);
}
async function generarLink(){
  try{ await post({ invitacion:'generar' }); await cargar(); modalAcceso(); }catch(e){ alert(e.message); }
}
async function revocarLink(){
  if(!confirm('¿Dar de baja el link? El que lo tenga deja de poder entrar.')) return;
  try{ await post({ invitacion:'revocar' }); await cargar(); modalAcceso(); }catch(e){ alert(e.message); }
}
async function sacarAcceso(){
  if(!confirm('¿Sacarle el acceso? Deja de poder entrar hasta que le generes un link nuevo.')) return;
  try{ await post({ proveedor:{ nombre: D.proveedor.nombre, email: '' } });
    await cargar(); modalAcceso(); }catch(e){ alert(e.message); }
}
function copiarLink(){
  const i = document.getElementById('svLink');
  i.select();
  if(navigator.clipboard) navigator.clipboard.writeText(i.value).then(() => showToast('Link copiado'));
  else { document.execCommand('copy'); showToast('Link copiado'); }
}
function mandarPorWhatsApp(){
  const link = document.getElementById('svLink').value;
  const txt = 'Hola ' + D.proveedor.nombre + '! Te paso el link para que veas nuestra cuenta corriente ' +
    'cuando quieras: ' + link + ' - entras con tu cuenta de Google y listo.';
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

async function borrar(campo, id){
  if(!confirm('¿Borrar este movimiento?')) return;
  try{ const b = {}; b[campo] = id; await post(b); await cargar(); }
  catch(e){ alert(e.message); }
}

bootPanel(cargar, { admin:false });
</script>
</body>
</html>
