<!doctype html>
<html lang="es">
<head>

<title>Consignación · REC Eyewear</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  /* ---------- los tres números de arriba ---------- */
  .heroes{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:18px;margin:6px 0 34px}
  .hero{border-radius:20px;padding:24px 28px 22px;border:1px solid transparent}
  .hero .et{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;margin:0 0 12px}
  .hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:0;line-height:1.05}
  .hero .ch{font-size:14px;margin:10px 0 0;line-height:1.55}
  .hero.debe{background:var(--nobg);border-color:#f0d2ce}
  .hero.debe .et,.hero.debe .big{color:var(--no)}
  .hero.debe .ch{color:#8c4a44}
  .hero.stock{background:var(--azbg);border-color:#d3e0ee}
  .hero.stock .et,.hero.stock .big{color:var(--az)}
  .hero.stock .ch{color:#4d6b8c}
  .hero.cobrar{background:var(--cd);border-color:var(--ln)}
  .hero.cobrar .et{color:var(--al)}
  .hero.cobrar .big{color:var(--tx);font-size:32px}
  .hero.cobrar .ch{color:var(--mt)}

  /* ---------- botones de acción ---------- */
  .b.azul{border-color:#bcd0e6;color:var(--az)}
  .b.azul:hover{background:var(--azbg);border-color:var(--az)}
  .b.verde{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
  .b.verde:hover{background:#256443;border-color:#256443}
  .top .der .b{height:44px;padding:0 20px}

  /* ---------- dos columnas ---------- */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:start}
  .caja{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:8px 30px 14px}
  .cabe{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:20px 0 14px;flex-wrap:wrap}
  .cabe h3{margin:0;font-size:17px;font-weight:600}
  .cabe .g{font-size:13.5px;color:var(--mt)}

  /* stock en tabla */
  .tabla{width:100%;border-collapse:collapse;font-size:14.5px}
  .tabla th{text-align:right;font-size:12px;font-weight:500;color:var(--mt);padding:0 0 10px 12px;border-bottom:1px solid var(--ln)}
  .tabla th:first-child,.tabla td:first-child{text-align:left;padding-left:0}
  .tabla td{text-align:right;padding:13px 0 13px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
  .tabla td:first-child{white-space:normal;font-weight:500}
  .tabla td .g{display:block;font-size:12px;color:var(--mt);font-weight:400;margin-top:2px}
  .tabla tfoot td{border-bottom:none;font-weight:600;padding-top:15px}
  .tabla .neg{color:var(--no)}
  .tabla .az{color:var(--az)}

  /* ventas */
  .venta{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-top:1px solid var(--ln)}
  .venta .quien{font-size:15.5px;font-weight:600;margin:0}
  .venta .f{font-size:13px;color:var(--mt);margin:4px 0 0}
  .venta .items{font-size:14px;color:var(--md);margin:9px 0 0;line-height:1.6}
  .venta .tags{margin-top:10px}
  .venta .plata{text-align:right;white-space:nowrap}
  .venta .plata .l{font-size:12px;color:var(--mt);margin:0}
  .venta .plata .v{font-size:17px;font-weight:600;margin:1px 0 10px}
  .venta .plata .v.rojo{color:var(--no)}
  .venta .plata .v.gris{color:var(--mt);font-weight:500}
  .venta .x{background:none;border:none;color:var(--ln2);font-size:17px;padding:0 0 0 10px;align-self:flex-start}
  .venta .x:hover{color:var(--no)}
  .tag{display:inline-block;font-size:12px;border-radius:999px;padding:4px 10px;white-space:nowrap;margin:0 5px 4px 0;font-weight:500}
  .tag.ok{background:var(--okbg);color:var(--ok)}
  .tag.no{background:var(--nobg);color:var(--no)}
  .tag.al{background:var(--albg);color:var(--al)}
  .tag.gris{background:#f0efe9;color:var(--md)}

  .mov{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--ln);font-size:14px}
  .mov .f{font-size:12.5px;color:var(--mt);margin:2px 0 0}
  .mov .x{background:none;border:none;color:var(--ln2);font-size:16px;padding:0 0 0 8px}
  .mov .x:hover{color:var(--no)}
  .plegar{background:none;border:none;color:var(--md);font-size:13.5px;padding:14px 0 6px;width:100%;text-align:left}
  .plegar:hover{color:var(--tx)}

  /* modales */
  .aviso-c{font-size:12.5px;color:var(--al);margin-top:6px}
  .precio-web{font-size:14px;text-align:right;color:var(--md);white-space:nowrap}
  .pagar-l{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--ln);font-size:14px;font-weight:400;cursor:pointer;margin:0}
  .pagar-l input{width:auto;margin:3px 0 0;flex:none}
  .pagar-l .g{color:var(--mt);font-size:12.5px;display:block;margin-top:2px}
  .pagar-l .m{margin-left:auto;white-space:nowrap;font-weight:600;color:var(--no)}

  /* ---------- vista cliente: pantalla completa, sin números internos ---------- */
  .b.cli{background:#fff;border-color:var(--tx);font-weight:600}
  .vc{position:fixed;inset:0;z-index:45;background:var(--pg);display:none;flex-direction:column}
  .vc.open{display:flex}
  .vc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;

  .vc-body{flex:1;overflow-y:auto;padding:26px 28px 30px}
  .vc-in{max-width:1180px;margin:0 auto}
  .vc h2{font-size:26px;font-weight:600;letter-spacing:-.4px;margin:0 0 4px}
  .vc .vsub{color:var(--mt);font-size:14.5px;margin:0 0 22px}
  .lineas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .ln-t{background:var(--cd);border:2px solid var(--ln);border-radius:22px;padding:20px 20px 16px;

  .ln-t .pre input{border:none;border-bottom:1px dashed var(--ln2);background:transparent;font:inherit;

  .ln-t .pre input:focus{outline:none;border-bottom-color:var(--tx)}

  .ln-t input::-webkit-inner-spin-button,.ln-t input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .step{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pg);border-radius:14px;padding:5px}
  .step button{width:46px;height:46px;border-radius:11px;border:none;background:var(--cd);font-size:24px;
    line-height:1;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .step button:active{transform:scale(.95)}
  .step button.mas-b{background:var(--tx);color:#fff}
  .step button:disabled{opacity:.3}
  .step input{width:60px;text-align:center;border:none;background:transparent;font:inherit;font-size:22px;
    font-weight:600;color:var(--tx);-moz-appearance:textfield}
  .step input:focus{outline:none}
  .ln-t .sub-t{font-size:13.5px;color:var(--md);text-align:right;min-height:18px;margin:-4px 2px 0}

  .vc-bar{background:var(--tx);color:#fff;padding:16px 28px}
  .vc-bar .vc-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .vc-bar .res{flex:1;min-width:0;font-size:14px;color:#bdbab2;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .vc-bar .go.sec{background:transparent;color:#fff;border:1px solid #55524b}
  .vc-bar .go:disabled{opacity:.35}

  /* paso 2: confirmar */
  .conf{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .vcaja{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:22px 26px}
  .det-l{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
  .det-l b{font-weight:600}
  .det-l .g{color:var(--mt);font-size:13.5px;display:block;margin-top:2px}
  .det-t{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;font-size:18px;font-weight:600}
  .det-t b{font-size:30px;letter-spacing:-.8px}
  .vcaja label{display:block;font-size:13px;color:var(--md);font-weight:500;margin:18px 0 7px}
  .vcaja label.pri{margin-top:0}
  .vcaja input[type=email],.vcaja input[type=text],.vcaja input[type=number]{width:100%;border:1px solid var(--ln2);border-radius:12px;

  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:100px;height:50px;border-radius:12px;border:1px solid var(--ln2);background:var(--cd);
    font-size:15px;font-weight:500;color:var(--tx)}
  .seg button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
  .seg button.on.verde{background:var(--ok);border-color:var(--ok)}

  .det-s{display:flex;justify-content:space-between;padding:12px 0 0;font-size:15px;color:var(--md)}
  .det-s.verde{color:var(--ok);font-weight:500;padding-top:6px}
  .det-s+.det-t{margin-top:10px;border-top:1px solid var(--ln)}
  .add-l{background:none;border:none;color:var(--md);font-size:14.5px;font-weight:500;padding:14px 0 2px}
  .add-l:hover{color:var(--tx)}
  .x-d{background:none;border:none;color:var(--mt);font-size:22px;width:36px;height:36px;border-radius:9px;flex:none}
  .x-d:hover{background:var(--pg);color:var(--no)}
  .desc-box{padding:14px 0 4px}
  .desc-in{display:flex;align-items:center;gap:10px}
  .desc-in>span{font-size:15px;font-weight:500;margin-right:auto}
  .vcaja .desc-in input{width:110px;padding:10px 12px;text-align:right}
  .seg.mini{gap:6px;flex-wrap:wrap}
  .seg.mini button{min-width:0;height:40px;padding:0 12px;font-size:14px;flex:1}
  .desc-in .seg.mini button{width:44px;flex:none;padding:0}
  .pg-row{border:1px solid var(--ln);border-radius:16px;padding:12px;margin-top:12px}
  .pg-monto{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:18px;font-weight:600;color:var(--md)}
  .vcaja .pg-monto input{flex:1;padding:11px 13px;font-size:18px;font-weight:600}
  .pg-estado{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:14.5px;font-weight:500}
  .pg-estado.ok{background:var(--okbg);color:var(--ok)}
  .pg-estado.al{background:var(--albg);color:var(--al)}
  .pg-estado.mal{background:var(--nobg);color:var(--no)}
  .vcaja label.chk{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:15px;color:var(--tx);cursor:pointer}
  .chk input{width:20px;height:20px;accent-color:var(--tx);margin:0}
  .nota-vc{font-size:13px;color:var(--mt);margin:10px 0 0;line-height:1.5}
  .listo{text-align:center;padding:10vh 16px}
  .listo .ok{width:84px;height:84px;border-radius:50%;background:var(--okbg);color:var(--ok);font-size:44px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  .listo h2{font-size:30px}
  .listo p{color:var(--md);font-size:16px;line-height:1.7;margin:8px 0 28px}

  @media (max-width:760px){ .conf{grid-template-columns:1fr} .vc-top,.vc-body,.vc-bar{padding-left:16px;padding-right:16px}
    .lineas{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px} .ln-t{padding:16px 12px 12px}
    .ln-t .nom{font-size:16px} .step button{width:38px;height:38px} .step input{width:44px}
    .vc-bar{padding-top:12px;padding-bottom:12px} .vc-bar .vc-in{flex-wrap:nowrap;gap:10px} .vc-bar .res{display:none}
    .vc-bar .tot{flex:1;text-align:left;min-width:0} .vc-bar .tot b{font-size:26px}
    .vc-bar .go{height:52px;padding:0 16px;font-size:15px} .vc-bar .go.sec .tx{display:none} .vc-top .marca span{display:none} }

  @media (max-width:1050px){ .heroes{grid-template-columns:1fr 1fr} .hero.cobrar{grid-column:1/-1} .cols{grid-template-columns:1fr} }
  @media (max-width:640px){ .heroes{grid-template-columns:1fr} .hero .big{font-size:30px} .caja{padding:4px 16px 10px}
    .venta{flex-direction:column} .venta .plata{text-align:left} .top .der{width:100%} .top .der .b{flex:1} }
</style>

<script>
/* La mercadería que me dejó el proveedor en consignación (api/consignacion.js).
   - Agregué: entra stock (él lo ve, es lo que dejó).
   - Vendí: baja el stock y queda debiéndose, en esta cuenta y no en la
     corriente. Él no ve las ventas. El precio de venta sale de la tienda.
   - Le pagué: él ve solo el pago, en su pestaña de consignación. */
let D = null, elegido = null, filas = [], modo = 'venta', verEntradas = false;
let PRODUCTOS_WEB = null;   // el catálogo de la tienda, para sacar los precios de venta

const plata = (n, moneda) => moneda === 'USD' ? usd(n) : fmt(n);
const P = () => D.proveedor;
const tasa = () => Number((D.usd && D.usd.valor) || 0);
const aPesos = (n) => P().moneda === 'USD' ? (tasa() ? fmt(n * tasa()) : '') : fmt(n);
const normTxt = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

// Lee el catálogo directamente de la tienda: es la misma lista de precios que
// ven los clientes, así que no hay que mantener otra.
async function cargarCatalogo(){
  if(PRODUCTOS_WEB) return;
  try{
    const html = await (await fetch('/', { cache:'no-store' })).text();
    const ini = html.indexOf('const PRODUCTS = [');
    const desde = html.indexOf('[', ini);
    const hasta = html.indexOf('\n];', desde);
    PRODUCTOS_WEB = ini < 0 || hasta < 0 ? [] : new Function('return ' + html.slice(desde, hasta + 2))();
  }catch(e){ PRODUCTOS_WEB = []; }
}

// Precio de venta de cada línea del proveedor: el que más se repite en la
// tienda entre los productos de esa línea (dividido por las unidades del pack).
let PRECIO_WEB = new Map(), NOMBRE_WEB = new Map();
function armarPreciosWeb(){
  const mapa = new Map((D.mapa || []).map(m => [m.patron, m]));
  const cuenta = new Map(), nombres = new Map();
  (PRODUCTOS_WEB || []).forEach(p => {
    const linea = splitNombre(p.name).linea;
    const m = mapa.get(normTxt(linea));
    if(!m) return;
    const k = m.articulo.toUpperCase();
    const n = nombres.get(k) || {};
    n[linea] = (n[linea] || 0) + 1;
    nombres.set(k, n);
    const precio = Math.round((Number(p.price) || 0) / (m.factor || 1));
    if(!precio) return;
    const c = cuenta.get(k) || {};
    c[precio] = (c[precio] || 0) + 1;
    cuenta.set(k, c);
  });
  NOMBRE_WEB = new Map([...nombres].map(([k, c]) =>
    [k, Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]]));
  PRECIO_WEB = new Map([...cuenta].map(([k, c]) =>
    [k, Number(Object.entries(c).sort((a, b) => b[1] - a[1])[0][0])]));
}
const precioWeb = (art) => PRECIO_WEB.get(String(art || '').toUpperCase()) || 0;
// Cómo se llama la línea en la tienda (lo que ve el cliente); si no está, el nombre del proveedor.
const nombreWeb = (art) => NOMBRE_WEB.get(String(art || '').toUpperCase()) || art;
// Lo que se cobró (o se va a cobrar) por una venta. Las viejas no tenían
// precio cargado: se valúan con el precio de la tienda.
const ventaDe = (v) => Number(v.total_venta) > 0 ? Number(v.total_venta)
  : (v.items || []).reduce((a, it) => a + (Number(it.cantidad) || 0) * precioWeb(it.articulo), 0);

async function cargar(){
  try{
    const [d] = await Promise.all([
      api('/api/consignacion' + (elegido ? '?proveedor=' + elegido : '')),
      cargarCatalogo(),
    ]);
    D = d;
    elegido = D.proveedor && D.proveedor.id;
    armarPreciosWeb();
    pintar();
  }catch(e){
    if(esSesion(e)) return logout();
    document.getElementById('cuerpo').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

function pintar(){
  if(!D.proveedor){ document.getElementById('cuerpo').innerHTML = '<div class="empty">Todavía no hay proveedores.</div>'; return; }
  const Pr = P(), R = D.resumen;

  document.getElementById('titulo').textContent = 'Consignación de ' + Pr.nombre;
  document.getElementById('subtitulo').textContent =
    'Cuenta aparte de la cuenta corriente. ' + Pr.nombre + ' ve lo que te dejó y lo que le pagás de consignación; lo que vendés, no.';

  document.getElementById('provs').innerHTML = D.proveedores.length > 1
    ? D.proveedores.map(p => `<button class="chip ${p.id === Pr.id ? 'on' : ''}" onclick="elegido=${p.id};cargar()">${esc(p.nombre)}</button>`).join('')
    : '';

  // Lo que tengo en mano, valuado a lo que le costaría a él y a precio de venta.
  const conStock = D.stock.filter(a => a.en_mano > 0);
  const valorCosto = conStock.reduce((s, a) => s + a.en_mano * a.precio, 0);

    : '<div class="empty">No tenés mercadería de ' + esc(Pr.nombre) + ' en consignación.</div>';

  const entradas = D.entradas.map(e => `<div class="mov">

  /* ----- ventas ----- */
  const totalVendido = D.ventas.reduce((s, v) => s + ventaDe(v), 0);
  const ventasHtml = D.ventas.length
    ? D.ventas.map(v => {
        const items = (v.items || []).map(i => `${i.cantidad}× ${i.articulo}`).join(' · ');
        const venta = ventaDe(v);

            ? '<span class="tag ok">Le pagaste el ' + fechaCorta(v.pagada_at) + '</span>'
            : '<span class="tag no">Sin pagarle</span>')
          + (!v.order_id ? '' : debe > 0 ? '<span class="tag al">Te debe ' + fmt(debe) + '</span>' : '<span class="tag ok">Cobrada</span>');

}

/* ---------- filas de líneas (agregar y vender) ---------- */
function articulos(){
  const nombres = new Map();
  D.stock.forEach(a => nombres.set(a.articulo.toUpperCase(), a.articulo));
  D.precios.forEach(p => { if(!nombres.has(p.articulo.toUpperCase())) nombres.set(p.articulo.toUpperCase(), p.articulo); });
  return [...nombres.values()];
}
const enMano = (art) => { const a = D.stock.find(x => x.articulo.toUpperCase() === String(art).toUpperCase()); return a ? a.en_mano : 0; };
const costoDe = (art) => { const p = D.precios.find(x => x.articulo.toUpperCase() === String(art).toUpperCase()); return p ? Number(p.precio) : 0; };

function renderFilas(){
  const esVenta = modo === 'venta';
  document.getElementById('filas').innerHTML = filas.map((f, i) => {
    const pw = precioWeb(f.articulo);
    // En la venta el precio sale de la tienda. Solo se pide a mano si esa
    // línea no está en la tienda.
    const precio = esVenta
      ? (!f.articulo ? '<span class="precio-web">—</span>'
         : pw ? `<span class="precio-web">${fmt(pw)} c/u</span>`
         : `<input type="number" min="0" placeholder="$ c/u" value="${f.precio || ''}" oninput="filas[${i}].precio=this.value;totalFilas()">`)
      : `<input type="number" min="0" step="0.01" placeholder="${P().moneda === 'USD' ? 'US$ c/u' : '$ c/u'}" value="${f.precio || ''}" oninput="filas[${i}].precio=this.value;totalFilas()">`;
    return `<div class="qrow" style="grid-template-columns:1fr 74px 104px 26px">
      ${esVenta
        ? `<select onchange="filas[${i}].articulo=this.value;renderFilas()">
            <option value="">— línea —</option>
            ${articulos().map(a => `<option value="${esc(a)}"${f.articulo === a ? ' selected' : ''}>${esc(a)} (quedan ${enMano(a)})</option>`).join('')}
          </select>`
        : `<input type="text" list="artList" placeholder="Línea (ej. CLIPON)" value="${esc(f.articulo)}" onchange="elegirArt(${i},this.value)">`}
      <input type="number" min="1" placeholder="cant." value="${f.cantidad || ''}" oninput="filas[${i}].cantidad=this.value;totalFilas()">
      ${precio}
      <button class="b q ico" style="height:32px;width:26px" onclick="filas.splice(${i},1);renderFilas()">×</button>
    </div>`;
  }).join('')
  + (esVenta ? '' : `<datalist id="artList">${articulos().map(a => `<option value="${esc(a)}">`).join('')}</datalist>`);
  totalFilas();
}
function elegirArt(i, valor){
  const v = String(valor || '').trim();
  const existente = articulos().find(a => a.toUpperCase() === v.toUpperCase());
  filas[i].articulo = existente || v.toUpperCase();
  if(!filas[i].precio && costoDe(filas[i].articulo)) filas[i].precio = costoDe(filas[i].articulo);
  renderFilas();
}
function agregarFila(){ filas.push({ articulo:'', cantidad:'', precio:'' }); renderFilas(); }
const precioVentaFila = (f) => precioWeb(f.articulo) || Number(f.precio) || 0;
function totalFilas(){
  const Pr = P();
  const tot = document.getElementById('fTot');
  const c = document.getElementById('fCosto');
  if(modo === 'agrega'){
    const t = filas.reduce((a, f) => a + (Number(f.cantidad) || 0) * (Number(f.precio) || costoDe(f.articulo)), 0);
    const u = filas.reduce((a, f) => a + (Number(f.cantidad) || 0), 0);
    if(tot) tot.textContent = u + ' u. · ' + plata(t, Pr.moneda);
    return;
  }
  const venta = filas.reduce((a, f) => a + (Number(f.cantidad) || 0) * precioVentaFila(f), 0);
  const costo = filas.reduce((a, f) => a + (Number(f.cantidad) || 0) * costoDe(f.articulo), 0);
  const pasados = filas.filter(f => f.articulo && Number(f.cantidad) > enMano(f.articulo)).map(f => f.articulo);
  if(tot) tot.textContent = fmt(venta);
  if(c) c.innerHTML = 'Le vas a deber a ' + esc(Pr.nombre) + ': <b style="color:var(--no)">' + plata(costo, Pr.moneda) + '</b>'
    + (pasados.length ? '<div class="aviso-c">Ojo: vendés más de lo que tenés de ' + esc(pasados.join(', ')) + '. Se guarda igual.</div>' : '');
}

/* ---------- vista cliente ---------- */
// Pantalla completa para armar el pedido delante del cliente: un botón por
// línea con el precio de la tienda (se puede cambiar), cantidades y el total.
// No muestra stock, costos ni lo que se le debe al proveedor. Al confirmar se
// guarda igual que "Vendí", con el pago si ya lo hizo, y le llega el mail.
let VC = null;
const MAIL_OK = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const vcPrecio = (l) => { const p = VC.precio[l.art]; return p === undefined ? precioWeb(l.art) : (Number(p) || 0); };
const vcElegidas = () => VC.lineas.filter(l => VC.cant[l.art] > 0);
const vcBruto = () => vcElegidas().reduce((a, l) => a + VC.cant[l.art] * vcPrecio(l), 0);
// Descuento en pesos: si es %, sobre el bruto. Nunca más que el total.
const vcDescuento = () => {
  const b = vcBruto(), x = Math.max(0, Number(VC.desc.valor) || 0);
  return Math.min(b, Math.round(VC.desc.tipo === '%' ? b * Math.min(x, 100) / 100 : x));
};
const vcTotal = () => vcBruto() - vcDescuento();
const MEDIOS = ['Efectivo', 'Transferencia', 'Tarjeta', 'Otro'];

function abrirCliente(){
  if(!D || !D.proveedor) return;
  VC = {
    paso: 'elegir', cant: {}, precio: {}, email: '', nombre: '', mail: true,
    desc: { abierto: false, tipo: '%', valor: '' },
    // Pagos: uno por medio. El que tiene "auto" se completa solo con lo que falta.
    pago: 'no', pagos: [{ medio: 'Efectivo', monto: '', auto: true }],
    lineas: articulos().map(a => ({ art: a, nombre: nombreWeb(a) })).sort((x, y) => x.nombre.localeCompare(y.nombre)),
  };
  document.getElementById('vcFecha').textContent =
    new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('vc').classList.add('open');
  document.body.style.overflow = 'hidden';
  vcPintar();
}
function salirCliente(){
  if(VC && VC.paso !== 'listo' && vcElegidas().length && !confirm('¿Salir? Se pierde el pedido que estás armando.')) return;
  document.getElementById('vc').classList.remove('open');
  document.body.style.overflow = '';
  VC = null;
}
function vcIr(paso){ VC.paso = paso; vcPintar(); document.getElementById('vcScroll').scrollTop = 0; }

function vcPintar(){
  const bar = document.getElementById('vcBar');
  if(VC.paso === 'listo'){
    bar.style.display = 'none';
    document.getElementById('vcBody').innerHTML = `<div class="listo">
      <div class="ok">✓</div>
      <h2>¡Listo${VC.nombre.trim() ? ', ' + esc(VC.nombre.trim()) : ''}!</h2>
      <p>${VC.resultado}</p>
      <button class="b p" style="flex:none;height:54px;padding:0 34px" onclick="abrirCliente()">Nuevo pedido</button>
      <button class="b q" style="height:54px" onclick="salirCliente()">Volver al panel</button>
    </div>`;
    return;
  }
  bar.style.display = '';
  if(VC.paso === 'elegir'){
    document.getElementById('vcBody').innerHTML = `
      <h2>¿Qué vas a llevar?</h2>
      <p class="vsub">Tocá cada línea para sumar. Los precios son por unidad.</p>
      <div class="lineas">${VC.lineas.map((l, i) => vcTile(i)).join('') || '<div class="empty">No hay líneas cargadas.</div>'}</div>`;
  } else vcPintarConfirmar();
  vcPintarBarra();
}

/* paso 1: elegir */
function vcTile(i){
  const l = VC.lineas[i], q = VC.cant[l.art] || 0, pr = vcPrecio(l);
  return `<div class="ln-t ${q ? 'on' : ''}" id="vt${i}" onclick="vcSumar(${i},1,event)">
    <p class="nom">${esc(l.nombre)}</p>
    <label class="pre" onclick="event.stopPropagation()">$<input type="number" min="0" inputmode="numeric"
      class="${q && !pr ? 'falta' : ''}" value="${pr || ''}" placeholder="precio"
      oninput="vcSetPrecio(${i},this.value)"></label>
    <div class="step" onclick="event.stopPropagation()">
      <button onclick="vcSumar(${i},-1)" ${q ? '' : 'disabled'} aria-label="Uno menos">−</button>
      <input type="number" min="0" inputmode="numeric" value="${q}" onfocus="this.select()" onchange="vcSetCant(${i},this.value)">
      <button class="mas-b" onclick="vcSumar(${i},1)" aria-label="Uno más">+</button>
    </div>
    <div class="sub-t">${vcSubtotal(i)}</div>
  </div>`;
}
function vcSubtotal(i){
  const l = VC.lineas[i], q = VC.cant[l.art] || 0, pr = vcPrecio(l);
  return q && pr ? q + ' × ' + fmt(pr) + ' = <b>' + fmt(q * pr) + '</b>' : q ? 'Poné el precio' : '';
}
function vcRepintarTile(i){
  const el = document.getElementById('vt' + i);
  if(el) el.outerHTML = vcTile(i);
  vcPintarBarra();
}
function vcSumar(i, d, ev){
  if(ev && ev.target.closest('input,button,label')) return;
  const art = VC.lineas[i].art;
  VC.cant[art] = Math.max(0, (VC.cant[art] || 0) + d);
  vcRepintarTile(i);
}
function vcSetCant(i, v){
  VC.cant[VC.lineas[i].art] = Math.max(0, parseInt(v, 10) || 0);
  vcRepintarTile(i);
}
function vcSetPrecio(i, v){
  // Sin repintar la tarjeta, para no perder el foco mientras escribe.
  const l = VC.lineas[i];
  VC.precio[l.art] = v;
  const el = document.getElementById('vt' + i);
  if(el){
    el.querySelector('.sub-t').innerHTML = vcSubtotal(i);
    el.querySelector('.pre input').classList.toggle('falta', !!VC.cant[l.art] && !vcPrecio(l));
  }
  vcPintarBarra();
}

function vcPintarBarra(){
  const el = vcElegidas();
  const u = el.reduce((a, l) => a + VC.cant[l.art], 0);
  const sinPrecio = el.some(l => !vcPrecio(l));
  const res = el.length
    ? u + (u === 1 ? ' unidad' : ' unidades') + ' · ' + el.map(l => VC.cant[l.art] + '× ' + esc(l.nombre)).join(' · ')
    : 'Todavía no elegiste nada';
  const botones = VC.paso === 'elegir'
    ? `<button class="go" onclick="vcIr('confirmar')" ${el.length && !sinPrecio ? '' : 'disabled'}>${sinPrecio ? 'Falta un precio' : 'Continuar →'}</button>`
    : `<button class="go sec" onclick="vcIr('elegir')" title="Cambiar">←<span class="tx"> Cambiar</span></button>
       <button class="go" id="vcOk" onclick="vcGuardar()">Confirmar pedido</button>`;
  document.getElementById('vcBar').innerHTML = `<div class="vc-in">
    <div class="res">${res}</div>
    <div class="tot"><small>Total</small><b class="num">${fmt(vcTotal())}</b></div>
    ${botones}</div>`;
}

/* paso 2: confirmar, mail y pago */
function vcPintarConfirmar(){
  const hayMail = MAIL_OK.test(VC.email.trim());
  if(!hayMail && VC.pago !== 'no') VC.pago = 'no';
  document.getElementById('vcBody').innerHTML = `
    <h2>Tu pedido</h2>
    <p class="vsub">Revisá que esté todo bien.</p>
    <div class="conf">
      <div class="vcaja">
        ${vcElegidas().map(l => `<div class="det-l">
            <div><b>${esc(l.nombre)}</b><span class="g">${VC.cant[l.art]} × ${fmt(vcPrecio(l))}</span></div>
            <div class="num">${fmt(VC.cant[l.art] * vcPrecio(l))}</div></div>`).join('')}
        ${VC.desc.abierto ? `
          <div class="desc-box">
            <div class="desc-in">
              <span>Descuento</span>
              <div class="seg mini">
                <button class="${VC.desc.tipo === '%' ? 'on' : ''}" onclick="vcDescTipo('%')">%</button>
                <button class="${VC.desc.tipo === '$' ? 'on' : ''}" onclick="vcDescTipo('$')">$</button>
              </div>
              <input type="number" min="0" inputmode="numeric" id="vcDescVal" placeholder="${VC.desc.tipo === '%' ? '10' : '5000'}"
                value="${esc(VC.desc.valor)}" oninput="VC.desc.valor=this.value;vcTotales()">
              <button class="x-d" title="Sacar descuento" onclick="VC.desc={abierto:false,tipo:'%',valor:''};vcPintarConfirmar();vcPintarBarra()">×</button>
            </div>
          </div>` : `<button class="add-l" onclick="VC.desc.abierto=true;vcPintarConfirmar();document.getElementById('vcDescVal').focus()">+ Descuento</button>`}
        <div id="vcTotales">${vcTotalesHtml()}</div>
      </div>
      <div class="vcaja">
        <label class="pri">Mail</label>
        <input type="email" id="vcMail" list="vcClientes" placeholder="optica@gmail.com" autocomplete="off"
          value="${esc(VC.email)}" oninput="vcMail(this.value)">
        <datalist id="vcClientes">${(D.clientes || []).map(c => `<option value="${esc(c.email)}">${esc(c.nombre || '')}</option>`).join('')}</datalist>
        <label>Nombre u óptica</label>
        <input type="text" id="vcNom" placeholder="Óptica Matías" value="${esc(VC.nombre)}" oninput="VC.nombre=this.value">
        <div id="vcPagoBox">${vcPagoHtml(hayMail)}</div>
      </div>
    </div>`;
  vcPagosRecalc();
}
function vcTotalesHtml(){
  const d = vcDescuento();
  return (d ? `<div class="det-s"><span>Subtotal</span><span class="num">${fmt(vcBruto())}</span></div>
      <div class="det-s verde"><span>Descuento${VC.desc.tipo === '%' ? ' ' + esc(VC.desc.valor) + '%' : ''}</span><span class="num">−${fmt(d)}</span></div>` : '')
    + `<div class="det-t"><span>Total</span><b class="num">${fmt(vcTotal())}</b></div>`;
}
// Cambió el descuento: totales, barra y lo que se completa solo en los pagos.
function vcTotales(){
  document.getElementById('vcTotales').innerHTML = vcTotalesHtml();
  vcPintarBarra();
  vcPagosRecalc();
}
function vcDescTipo(t){ VC.desc.tipo = t; VC.desc.valor = ''; vcPintarConfirmar(); vcPintarBarra(); document.getElementById('vcDescVal').focus(); }

/* pagos: uno o más medios */
const vcPagado = () => VC.pagos.reduce((a, p) => a + (Math.round(Number(p.monto) || 0)), 0);
function vcPagosRecalc(){
  if(VC.pago !== 'si') return;
  const auto = VC.pagos.findIndex(p => p.auto);
  if(auto >= 0){
    const otros = VC.pagos.reduce((a, p, j) => a + (j === auto ? 0 : Math.round(Number(p.monto) || 0)), 0);
    VC.pagos[auto].monto = String(Math.max(0, vcTotal() - otros));
    const inp = document.getElementById('vcPm' + auto);
    if(inp) inp.value = VC.pagos[auto].monto;
  }
  const est = document.getElementById('vcPagoEstado');
  if(est) est.outerHTML = vcPagoEstadoHtml();
}
function vcPagoEstadoHtml(){
  const t = vcTotal(), p = vcPagado();
  const [cls, txt] = p === t ? ['ok', '✓ Pagó todo: ' + fmt(t)]
    : p > t ? ['mal', 'Se pasa por ' + fmt(p - t)]
    : ['al', 'Pagó ' + fmt(p) + ' · queda debiendo ' + fmt(t - p)];
  return `<div class="pg-estado ${cls}" id="vcPagoEstado">${txt}</div>`;
}
function vcPagoMonto(j, v){
  VC.pagos[j].monto = v;
  VC.pagos[j].auto = false;
  vcPagosRecalc();
}
function vcPagoMedio(j, m){ VC.pagos[j].medio = m; vcRepintarPago(); }
function vcPagoOtro(){
  const usados = VC.pagos.map(p => p.medio);
  VC.pagos.push({ medio: MEDIOS.find(m => !usados.includes(m)) || 'Otro', monto: '', auto: false });
  vcRepintarPago();
  const inp = document.getElementById('vcPm' + (VC.pagos.length - 1));
  if(inp) inp.focus();
}
function vcPagoSacar(j){
  VC.pagos.splice(j, 1);
  if(!VC.pagos.some(p => p.auto)) VC.pagos[0].auto = true;   // el que queda absorbe lo que falta
  vcRepintarPago();
}

function vcPagoHtml(hayMail){
  return `
    <label>¿Ya lo pagó?</label>
    <div class="seg">
      <button class="${VC.pago === 'no' ? 'on' : ''}" onclick="vcPago('no')">Todavía no</button>
      <button class="${VC.pago === 'si' ? 'on verde' : ''}" onclick="vcPago('si')" ${hayMail ? '' : 'disabled'}>Sí, pagó</button>
    </div>
    ${VC.pago === 'si' ? VC.pagos.map((p, j) => `
      <div class="pg-row">
        <div class="seg mini">${MEDIOS.map(m => `<button class="${p.medio === m ? 'on' : ''}" onclick="vcPagoMedio(${j},'${m}')">${m}</button>`).join('')}</div>
        <div class="pg-monto">
          <span>$</span>
          <input type="number" min="0" inputmode="numeric" id="vcPm${j}" value="${esc(p.monto)}" placeholder="monto"
            onfocus="this.select()" oninput="vcPagoMonto(${j},this.value)">
          ${VC.pagos.length > 1 ? `<button class="x-d" title="Sacar este pago" onclick="vcPagoSacar(${j})">×</button>` : ''}
        </div>
      </div>`).join('')
      + (VC.pagos.length < 3 ? `<button class="add-l" onclick="vcPagoOtro()">+ Otro medio de pago</button>` : '')
      + vcPagoEstadoHtml() : ''}
    <label class="chk"><input type="checkbox" ${VC.mail && hayMail ? 'checked' : ''} ${hayMail ? '' : 'disabled'}
      onchange="VC.mail=this.checked"> Mandarle el detalle por mail</label>
    ${hayMail ? '' : '<p class="nota-vc">Con el mail le llega el detalle y queda registrado lo que pagó.</p>'}`;
}
function vcRepintarPago(){
  const hayMail = MAIL_OK.test(VC.email.trim());
  if(!hayMail) VC.pago = 'no';
  document.getElementById('vcPagoBox').innerHTML = vcPagoHtml(hayMail);
  vcPagosRecalc();
}
function vcPago(p){ VC.pago = p; vcRepintarPago(); }
function vcMail(v){
  const antes = MAIL_OK.test(VC.email.trim());
  VC.email = v;
  const c = (D.clientes || []).find(x => x.email && x.email.toLowerCase() === v.trim().toLowerCase());
  if(c && c.nombre && !VC.nombre.trim()){ VC.nombre = c.nombre; document.getElementById('vcNom').value = c.nombre; }
  if(antes !== MAIL_OK.test(v.trim())) vcRepintarPago();
}

async function vcGuardar(){
  const email = VC.email.trim();
  const hayMail = MAIL_OK.test(email);
  if(email && !hayMail) return alert('Ese mail no parece válido.');
  const total = vcTotal(), descuento = vcDescuento();
  const cobros = hayMail && VC.pago === 'si'
    ? VC.pagos.map(p => ({ medio: p.medio, monto: Math.round(Number(p.monto) || 0) })).filter(p => p.monto > 0)
    : [];
  const monto = cobros.reduce((a, p) => a + p.monto, 0);
  if(hayMail && VC.pago === 'si'){
    if(monto <= 0) return alert('Poné cuánto pagó.');
    if(monto > total) return alert('Los pagos suman ' + fmt(monto) + ' y el total es ' + fmt(total) + '.');
  }
  const items = vcElegidas().map(l => ({ articulo: l.art, nombre: l.nombre, cantidad: VC.cant[l.art], precio: vcPrecio(l) }));
  const btn = document.getElementById('vcOk');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
  try{
    const r = await post({ venta:{
      email, cliente: VC.nombre, fecha: hoyISO(), nota: '', items, descuento, cobros,
      mandarMail: hayMail && VC.mail } });
    const partes = [(r.order_id ? 'Pedido #' + r.order_id + ' · ' : '') + fmt(total) + (descuento ? ' (con ' + fmt(descuento) + ' de descuento)' : '')];
    if(monto) partes.push((monto >= total ? 'Pagado' : 'Pagó ' + fmt(monto) + ' · quedan ' + fmt(total - monto))
      + (cobros.length > 1 ? ': ' + cobros.map(p => esc(p.medio) + ' ' + fmt(p.monto)).join(' + ') : ' en ' + esc(cobros[0].medio).toLowerCase()));
    if(hayMail && VC.mail) partes.push(r.mail ? 'Te mandamos el detalle a ' + esc(email) : 'No se pudo mandar el mail');
    VC.resultado = partes.join('<br>');
    VC.paso = 'listo';
    vcPintar();
    cargar();
  }catch(e){
    alert(e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Confirmar pedido'; }
  }
}

/* ---------- borrar ---------- */
async function borrarVenta(id){
  if(!confirm('¿Borrar esta venta? Se borra también el pedido del cliente, sus cobros y lo que sumó a la deuda.')) return;
  try{ await post({ borrarVenta: id }); showToast('Borrada'); await cargar(); }
  catch(e){ alert(e.message); }
}
async function borrarPago(id){
  if(!confirm('¿Borrar este pago? Las ventas que cubría vuelven a quedar sin pagar.')) return;
  try{ await post({ borrarPago: id }); showToast('Pago borrado'); await cargar(); }
  catch(e){ alert(e.message); }
}
async function borrarEntrada(id){
  if(!confirm('¿Borrar este movimiento de mercadería?')) return;
  try{ await post({ borrarEntrada: id }); showToast('Borrado'); await cargar(); }
  catch(e){ alert(e.message); }
}

async function post(body){
  return api('/api/consignacion', { method:'POST',
    body: JSON.stringify(Object.assign({ supplier_id: D.proveedor.id }, body)) });
}

bootPanel(cargar);
</script>
