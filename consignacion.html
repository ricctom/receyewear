<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Consignación · REC Eyewear</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="panel.css"/>
<style>
  /* ---------- los tres números de arriba ---------- */
  .heroes{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:18px;margin:6px 0 34px}
  .hero{border-radius:20px;padding:24px 28px 22px;border:1px solid transparent}
  .hero .et{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;margin:0 0 12px}
  .hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:0;line-height:1.05}
  .hero .ch{font-size:14px;margin:10px 0 0;line-height:1.55}
  .hero.debe{background:var(--nobg);border-color:#f0d2ce}
  .hero.debe .et,.hero.debe .big{color:var(--no)}
  .hero.debe .ch{color:#8c4a44}
  .hero.stock{background:var(--azbg);border-color:#d3e0ee}
  .hero.stock .et,.hero.stock .big{color:var(--az)}
  .hero.stock .ch{color:#4d6b8c}
  .hero.aldia{background:var(--okbg);border-color:#cde0d4}
  .hero.aldia .et,.hero.aldia .big{color:var(--ok)}
  .hero.aldia .ch{color:#3f6b53}
  .hero.cobrar{background:var(--cd);border-color:var(--ln)}
  .hero.cobrar .et{color:var(--al)}
  .hero.cobrar .big{color:var(--tx);font-size:32px}
  .hero.cobrar .ch{color:var(--mt)}

  /* ---------- botones de acción ---------- */
  .b.azul{border-color:#bcd0e6;color:var(--az)}
  .b.azul:hover{background:var(--azbg);border-color:var(--az)}
  .b.verde{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
  .b.verde:hover{background:#256443;border-color:#256443}
  .top .der .b{height:44px;padding:0 20px}

  /* ---------- dos columnas ---------- */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:start}
  .caja{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:8px 30px 14px}
  .cabe{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:20px 0 14px;flex-wrap:wrap}
  .cabe h3{margin:0;font-size:17px;font-weight:600}
  .cabe .g{font-size:13.5px;color:var(--mt)}

  /* stock en tabla */
  .tabla{width:100%;border-collapse:collapse;font-size:14.5px}
  .tabla th{text-align:right;font-size:12px;font-weight:500;color:var(--mt);padding:0 0 10px 12px;border-bottom:1px solid var(--ln)}
  .tabla th:first-child,.tabla td:first-child{text-align:left;padding-left:0}
  .tabla td{text-align:right;padding:13px 0 13px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
  .tabla td:first-child{white-space:normal;font-weight:500}
  .tabla td .g{display:block;font-size:12px;color:var(--mt);font-weight:400;margin-top:2px}
  .tabla tfoot td{border-bottom:none;font-weight:600;padding-top:15px}
  .tabla .neg{color:var(--no)}
  .tabla .az{color:var(--az)}

  /* ventas */
  .venta{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-top:1px solid var(--ln)}
  .venta .quien{font-size:15.5px;font-weight:600;margin:0}
  .venta .quien.tachada{color:var(--mt);text-decoration:line-through;text-decoration-thickness:1px}
  .venta .f{font-size:13px;color:var(--mt);margin:4px 0 0}
  .venta .items{font-size:14px;color:var(--md);margin:9px 0 0;line-height:1.6}
  .venta .tags{margin-top:10px}
  .venta .plata{text-align:right;white-space:nowrap}
  .venta .plata .l{font-size:12px;color:var(--mt);margin:0}
  .venta .plata .v{font-size:17px;font-weight:600;margin:1px 0 10px}
  .venta .plata .v.rojo{color:var(--no)}
  .venta .plata .v.gris{color:var(--mt);font-weight:500}
  .venta .x{background:none;border:none;color:var(--ln2);font-size:17px;padding:0 0 0 10px;align-self:flex-start}
  .venta .x:hover{color:var(--no)}
  .tag{display:inline-block;font-size:12px;border-radius:999px;padding:4px 10px;white-space:nowrap;margin:0 5px 4px 0;font-weight:500}
  .tag.ok{background:var(--okbg);color:var(--ok)}
  .tag.no{background:var(--nobg);color:var(--no)}
  .tag.al{background:var(--albg);color:var(--al)}
  .tag.gris{background:#f0efe9;color:var(--md)}

  .mov{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--ln);font-size:14px}
  .mov .f{font-size:12.5px;color:var(--mt);margin:2px 0 0}
  .mov .x{background:none;border:none;color:var(--ln2);font-size:16px;padding:0 0 0 8px}
  .mov .x:hover{color:var(--no)}
  .plegar{background:none;border:none;color:var(--md);font-size:13.5px;padding:14px 0 6px;width:100%;text-align:left}
  .plegar:hover{color:var(--tx)}

  /* modales */
  .aviso-c{font-size:12.5px;color:var(--al);margin-top:6px}
  .tabla td .g.cta{white-space:normal}
  .aviso-neg{background:var(--nobg);color:var(--no);border-radius:12px;padding:12px 16px;font-size:13.5px;line-height:1.6;margin:0 0 14px}

  /* giras */
  .giras{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .gira-c{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:20px 24px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .gira-c:hover{border-color:var(--ln2)}
  .gira-c h4{margin:0;font-size:16.5px;font-weight:600}
  .gira-c .f{font-size:13px;color:var(--mt);margin:4px 0 14px}
  .gira-c .queda{font-size:28px;font-weight:700;letter-spacing:-.6px;margin:0}
  .gira-c .queda.neg{color:var(--no)}
  .gira-c .l{font-size:12px;color:var(--mt);margin:0 0 2px}
  .gira-c .det{font-size:13px;color:var(--md);margin:12px 0 0;line-height:1.7}
  .volver{background:none;border:none;color:var(--md);font-size:14px;padding:0 0 14px}
  .volver:hover{color:var(--tx)}
  .tabla .res td{font-weight:700;font-size:16px;border-bottom:none}
  .tabla .menos{color:var(--no)}
  .tabla .mas{color:var(--ok)}
  .gira-acc{display:flex;gap:8px;flex-wrap:wrap}
  .precio-web{font-size:14px;text-align:right;color:var(--md);white-space:nowrap}
  .pagar-l{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--ln);font-size:14px;font-weight:400;cursor:pointer;margin:0}
  .pagar-l input{width:auto;margin:3px 0 0;flex:none}
  .pagar-l .g{color:var(--mt);font-size:12.5px;display:block;margin-top:2px}
  .pagar-l .m{margin-left:auto;white-space:nowrap;font-weight:600;color:var(--no)}
  /* qué ventas tacha el pago que se está por registrar */
  .p-todo{background:var(--okbg);border:1px solid #cde0d4;color:var(--ok);border-radius:11px;
    padding:10px 15px;font-size:13.5px;font-weight:600;margin-top:15px;font-family:inherit}
  .p-todo:hover{background:#ddece3}
  .prev-p{margin:18px 0 0;max-height:220px;overflow-y:auto}
  .prev-p .pagar-l{cursor:default}
  .prev-p .tick{flex:none;width:16px;color:var(--ok);font-weight:700}
  .prev-p .tick.med{color:var(--al)}
  .prev-p .tachada{color:var(--mt);text-decoration:line-through}
  .prev-p .m{color:var(--ok)}
  .prev-p .m.med{color:var(--al)}
  .prev-p .nada{color:var(--md);font-size:13.5px;line-height:1.6}

  /* ---------- vista cliente: pantalla completa, sin números internos ---------- */
  .b.cli{background:#fff;border-color:var(--tx);font-weight:600}
  .vc{position:fixed;inset:0;z-index:45;background:var(--pg);display:none;flex-direction:column}
  .vc.open{display:flex}
  .vc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;
    background:var(--cd);border-bottom:1px solid var(--ln)}
  .vc-top .marca{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
  .vc-top .marca span{font-weight:500;letter-spacing:.3px;text-transform:none;color:var(--mt);margin-left:12px;font-size:14px}
  .vc-body{flex:1;overflow-y:auto;padding:26px 28px 30px}
  .vc-in{max-width:1180px;margin:0 auto}
  .vc h2{font-size:26px;font-weight:600;letter-spacing:-.4px;margin:0 0 4px}
  .vc .vsub{color:var(--mt);font-size:14.5px;margin:0 0 22px}
  .lineas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .ln-t{background:var(--cd);border:2px solid var(--ln);border-radius:22px;padding:20px 20px 16px;
    display:flex;flex-direction:column;gap:14px;cursor:pointer;user-select:none;transition:border-color .12s,box-shadow .12s}
  .ln-t:hover{border-color:var(--ln2)}
  .ln-t.on{border-color:var(--tx);box-shadow:0 10px 30px rgba(28,27,25,.10)}
  .ln-t .nom{font-size:18px;font-weight:600;letter-spacing:-.2px;line-height:1.25;margin:0;min-height:45px}
  .ln-t .pre{display:flex;align-items:baseline;gap:4px;color:var(--md);font-size:20px;font-weight:600;cursor:text}
  .ln-t .pre input{border:none;border-bottom:1px dashed var(--ln2);background:transparent;font:inherit;
    font-size:22px;font-weight:600;color:var(--tx);width:120px;padding:0 0 2px;border-radius:0;-moz-appearance:textfield}
  .ln-t .pre input:focus{outline:none;border-bottom-color:var(--tx)}
  .ln-t .pre input.falta{border-bottom-color:var(--no)}
  .ln-t input::-webkit-inner-spin-button,.ln-t input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .step{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pg);border-radius:14px;padding:5px}
  .step button{width:46px;height:46px;border-radius:11px;border:none;background:var(--cd);font-size:24px;
    line-height:1;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .step button:active{transform:scale(.95)}
  .step button.mas-b{background:var(--tx);color:#fff}
  .step button:disabled{opacity:.3}
  .step input{width:60px;text-align:center;border:none;background:transparent;font:inherit;font-size:22px;
    font-weight:600;color:var(--tx);-moz-appearance:textfield}
  .step input:focus{outline:none}
  .ln-t .sub-t{font-size:13.5px;color:var(--md);text-align:right;min-height:18px;margin:-4px 2px 0}
  /* mercadería mía: el nombre y el precio los escribo yo, no es del proveedor */
  .ln-t.propio{position:relative;border-style:dashed}
  .ln-t.propio.on{border-style:solid}
  .ln-t .nom-in{border:none;border-bottom:1px dashed var(--ln2);background:transparent;font:inherit;
    font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--tx);width:100%;padding:18px 0 6px;
    border-radius:0;min-height:45px}
  .ln-t .nom-in:focus{outline:none;border-bottom-color:var(--tx)}
  .ln-t .mio{position:absolute;top:9px;right:16px;font-size:10.5px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--al)}
  .ln-t .quitar{position:absolute;top:4px;left:8px;background:none;border:none;color:var(--ln2);
    font-size:18px;padding:4px 8px;line-height:1}
  .ln-t .quitar:hover{color:var(--no)}
  .ln-add{background:transparent;border:2px dashed var(--ln2);border-radius:22px;padding:20px;
    color:var(--md);font:inherit;font-size:16px;font-weight:600;line-height:1.5;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px}
  .ln-add small{font-size:13px;font-weight:400;color:var(--mt)}
  .ln-add:hover{border-color:var(--tx);color:var(--tx)}

  .vc-bar{background:var(--tx);color:#fff;padding:16px 28px}
  .vc-bar .vc-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .vc-bar .res{flex:1;min-width:0;font-size:14px;color:#bdbab2;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-bar .tot{text-align:right}
  .vc-bar .tot small{display:block;font-size:12px;color:#98958d;letter-spacing:.8px;text-transform:uppercase}
  .vc-bar .tot b{font-size:34px;font-weight:700;letter-spacing:-1px}
  .vc-bar .go{height:58px;padding:0 30px;border-radius:14px;border:none;background:#fff;color:var(--tx);font-size:16px;font-weight:600}
  .vc-bar .go.sec{background:transparent;color:#fff;border:1px solid #55524b}
  .vc-bar .go:disabled{opacity:.35}

  /* paso 2: confirmar */
  .conf{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .vcaja{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:22px 26px}
  .det-l{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
  .det-l b{font-weight:600}
  .det-l .g{color:var(--mt);font-size:13.5px;display:block;margin-top:2px}
  .det-t{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;font-size:18px;font-weight:600}
  .det-t b{font-size:30px;letter-spacing:-.8px}
  .vcaja label{display:block;font-size:13px;color:var(--md);font-weight:500;margin:18px 0 7px}
  .vcaja label.pri{margin-top:0}
  .vcaja input[type=email],.vcaja input[type=text],.vcaja input[type=number]{width:100%;border:1px solid var(--ln2);border-radius:12px;
    padding:14px 15px;font-size:16px;font-family:inherit;background:var(--cd);color:var(--tx)}
  .vcaja input:focus{outline:none;border-color:var(--tx)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:100px;height:50px;border-radius:12px;border:1px solid var(--ln2);background:var(--cd);
    font-size:15px;font-weight:500;color:var(--tx)}
  .seg button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
  .seg button.on.verde{background:var(--ok);border-color:var(--ok)}
  .seg button:disabled{opacity:.35}
  .det-s{display:flex;justify-content:space-between;padding:12px 0 0;font-size:15px;color:var(--md)}
  .det-s.verde{color:var(--ok);font-weight:500;padding-top:6px}
  .det-s+.det-t{margin-top:10px;border-top:1px solid var(--ln)}
  .add-l{background:none;border:none;color:var(--md);font-size:14.5px;font-weight:500;padding:14px 0 2px}
  .add-l:hover{color:var(--tx)}
  .x-d{background:none;border:none;color:var(--mt);font-size:22px;width:36px;height:36px;border-radius:9px;flex:none}
  .x-d:hover{background:var(--pg);color:var(--no)}
  .desc-box{padding:14px 0 4px}
  .desc-in{display:flex;align-items:center;gap:10px}
  .desc-in>span{font-size:15px;font-weight:500;margin-right:auto}
  .vcaja .desc-in input{width:110px;padding:10px 12px;text-align:right}
  .seg.mini{gap:6px;flex-wrap:wrap}
  .seg.mini button{min-width:0;height:40px;padding:0 12px;font-size:14px;flex:1}
  .desc-in .seg.mini button{width:44px;flex:none;padding:0}
  .pg-row{border:1px solid var(--ln);border-radius:16px;padding:12px;margin-top:12px}
  .pg-monto{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:18px;font-weight:600;color:var(--md)}
  .vcaja .pg-monto input{flex:1;padding:11px 13px;font-size:18px;font-weight:600}
  .pg-estado{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:14.5px;font-weight:500}
  .pg-estado.ok{background:var(--okbg);color:var(--ok)}
  .pg-estado.al{background:var(--albg);color:var(--al)}
  .pg-estado.mal{background:var(--nobg);color:var(--no)}
  .vcaja label.chk{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:15px;color:var(--tx);cursor:pointer}
  .chk input{width:20px;height:20px;accent-color:var(--tx);margin:0}
  .nota-vc{font-size:13px;color:var(--mt);margin:10px 0 0;line-height:1.5}
  .listo{text-align:center;padding:10vh 16px}
  .listo .ok{width:84px;height:84px;border-radius:50%;background:var(--okbg);color:var(--ok);font-size:44px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  .listo h2{font-size:30px}
  .listo p{color:var(--md);font-size:16px;line-height:1.7;margin:8px 0 28px}

  @media (max-width:760px){ .conf{grid-template-columns:1fr} .vc-top,.vc-body,.vc-bar{padding-left:16px;padding-right:16px}
    .lineas{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px} .ln-t{padding:16px 12px 12px}
    .ln-t .nom{font-size:16px} .step button{width:38px;height:38px} .step input{width:44px}
    .vc-bar{padding-top:12px;padding-bottom:12px} .vc-bar .vc-in{flex-wrap:nowrap;gap:10px} .vc-bar .res{display:none}
    .vc-bar .tot{flex:1;text-align:left;min-width:0} .vc-bar .tot b{font-size:26px}
    .vc-bar .go{height:52px;padding:0 16px;font-size:15px} .vc-bar .go.sec .tx{display:none} .vc-top .marca span{display:none} }

  @media (max-width:1050px){ .heroes{grid-template-columns:1fr 1fr} .hero.cobrar{grid-column:1/-1} .cols{grid-template-columns:1fr} }
  @media (max-width:640px){ .heroes{grid-template-columns:1fr} .hero .big{font-size:30px} .caja{padding:4px 16px 10px}
    .venta{flex-direction:column} .venta .plata{text-align:left} .top .der{width:100%} .top .der .b{flex:1} }
</style>
</head>
<body>
<header>
  <h1>REC</h1>
  <nav class="tabs">
    <a href="admin.html">Pedidos</a>
    <a href="carritos.html">Carritos</a>
    <a href="crm.html">Clientes</a>
    <a href="proveedor.html">Proveedores</a>
    <a href="consignacion.html" class="on">Consignación</a>
    <a href="cupones.html">Cupones</a>
  </nav>
  <div class="who" id="who"></div>
</header>

<div class="wrap" id="gate">
  <div class="gate">
    <h2>Consignación</h2>
    <p>Entrá con la cuenta de Google de siempre.</p>
    <div id="gbtn"></div>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<div class="wrap" id="panel" style="display:none">
  <div class="top">
    <div>
      <h2 id="titulo">Consignación</h2>
      <div class="sub" id="subtitulo"></div>
    </div>
    <div class="der">
      <button class="b cli" onclick="abrirCliente()" title="Pantalla para armar el pedido delante del cliente">Vista cliente</button>
      <button class="b azul" onclick="modalAgrega()">+ Agregué mercadería</button>
      <button class="b p" style="flex:none" onclick="modalVenta()">Vendí</button>
      <button class="b verde" onclick="modalPaga()">Le pagué</button>
      <button class="b q ico" onclick="cargar()" title="Actualizar">↻</button>
    </div>
  </div>
  <div class="filtros" id="vistas"></div>
  <div class="filtros" id="provs"></div>
  <div class="heroes" id="heroes"></div>
  <div id="cuerpo"><div class="empty">Cargando…</div></div>
</div>

<!-- Vista cliente: tapa todo el panel, así no se ve lo que se le debe al proveedor -->
<div class="vc" id="vc">
  <div class="vc-top">
    <div class="marca">REC Eyewear<span id="vcFecha"></span></div>
    <button class="b q" onclick="salirCliente()">Salir</button>
  </div>
  <div class="vc-body" id="vcScroll"><div class="vc-in" id="vcBody"></div></div>
  <div class="vc-bar" id="vcBar"></div>
</div>

<div class="modal-ov" id="ov" onclick="cerrarModal()"></div>
<div class="modal" id="modal"><div id="modalBody"></div></div>

<script src="panel.js"></script>
<script>
/* La mercadería que me dejó el proveedor en consignación (api/consignacion.js).
   - Agregué: entra stock (él lo ve, es lo que dejó).
   - Vendí: baja el stock y queda debiéndose, en esta cuenta y no en la
     corriente. Él no ve las ventas. El precio de venta sale de la tienda.
   - Le pagué: él ve solo el pago, en su pestaña de consignación. */
let D = null, elegido = null, filas = [], modo = 'venta', verEntradas = false;
let vista = 'cuenta', giraAbierta = null;   // 'cuenta' con el proveedor o 'giras'
let PRODUCTOS_WEB = null;   // el catálogo de la tienda, para sacar los precios de venta

const plata = (n, moneda) => moneda === 'USD' ? usd(n) : fmt(n);
const P = () => D.proveedor;
const tasa = () => Number((D.usd && D.usd.valor) || 0);
const aPesos = (n) => P().moneda === 'USD' ? (tasa() ? fmt(n * tasa()) : '') : fmt(n);
const normTxt = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

// Lee el catálogo directamente de la tienda: es la misma lista de precios que
// ven los clientes, así que no hay que mantener otra.
async function cargarCatalogo(){
  if(PRODUCTOS_WEB) return;
  try{
    const html = await (await fetch('/', { cache:'no-store' })).text();
    const ini = html.indexOf('const PRODUCTS = [');
    const desde = html.indexOf('[', ini);
    const hasta = html.indexOf('\n];', desde);
    PRODUCTOS_WEB = ini < 0 || hasta < 0 ? [] : new Function('return ' + html.slice(desde, hasta + 2))();
  }catch(e){ PRODUCTOS_WEB = []; }
}

// Precio de venta de cada línea del proveedor: el que más se repite en la
// tienda entre los productos de esa línea (dividido por las unidades del pack).
let PRECIO_WEB = new Map(), NOMBRE_WEB = new Map();
function armarPreciosWeb(){
  const mapa = new Map((D.mapa || []).map(m => [m.patron, m]));
  const cuenta = new Map(), nombres = new Map();
  (PRODUCTOS_WEB || []).forEach(p => {
    const linea = splitNombre(p.name).linea;
    const m = mapa.get(normTxt(linea));
    if(!m) return;
    const k = m.articulo.toUpperCase();
    const n = nombres.get(k) || {};
    n[linea] = (n[linea] || 0) + 1;
    nombres.set(k, n);
    const precio = Math.round((Number(p.price) || 0) / (m.factor || 1));
    if(!precio) return;
    const c = cuenta.get(k) || {};
    c[precio] = (c[precio] || 0) + 1;
    cuenta.set(k, c);
  });
  NOMBRE_WEB = new Map([...nombres].map(([k, c]) =>
    [k, Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]]));
  PRECIO_WEB = new Map([...cuenta].map(([k, c]) =>
    [k, Number(Object.entries(c).sort((a, b) => b[1] - a[1])[0][0])]));
}
const precioWeb = (art) => PRECIO_WEB.get(String(art || '').toUpperCase()) || 0;
// Cómo se llama la línea en la tienda (lo que ve el cliente); si no está, el nombre del proveedor.
const nombreWeb = (art) => NOMBRE_WEB.get(String(art || '').toUpperCase()) || art;
// Líneas que no están publicadas en la tienda: precio de venta puesto a mano,
// para que en la vista cliente ya salga cargado y no haya que escribirlo en
// cada pedido. Igual se puede cambiar desde la tarjeta.
const PRECIO_FIJO = { 'NYLON SOL': 26300 };
// Con qué precio arranca cada línea en la vista cliente: el de la tienda y, si
// esa línea no está publicada, el fijo de acá.
const precioLista = (art) => precioWeb(art) || PRECIO_FIJO[String(art || '').toUpperCase()] || 0;
// Lo que se cobró (o se va a cobrar) por una venta. Las viejas no tenían
// precio cargado: se valúan con el precio de la tienda.
const ventaDe = (v) => Number(v.total_venta) > 0 ? Number(v.total_venta)
  : (v.items || []).reduce((a, it) => a + (Number(it.cantidad) || 0) * precioWeb(it.articulo), 0);

async function cargar(){
  try{
    const [d] = await Promise.all([
      api('/api/consignacion' + (elegido ? '?proveedor=' + elegido : '')),
      cargarCatalogo(),
    ]);
    D = d;
    elegido = D.proveedor && D.proveedor.id;
    armarPreciosWeb();
    pintar();
  }catch(e){
    if(esSesion(e)) return logout();
    document.getElementById('cuerpo').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

function pintar(){
  if(!D.proveedor){ document.getElementById('cuerpo').innerHTML = '<div class="empty">Todavía no hay proveedores.</div>'; return; }
  const Pr = P(), R = D.resumen;

  document.getElementById('titulo').textContent = 'Consignación de ' + Pr.nombre;
  document.getElementById('subtitulo').textContent =
    'Cuenta aparte de la cuenta corriente. ' + Pr.nombre + ' ve lo que te dejó y lo que le pagás de consignación; lo que vendés, no.';

  document.getElementById('vistas').innerHTML = [['cuenta', 'Cuenta con ' + Pr.nombre], ['giras', 'Giras']]
    .map(([k, t]) => `<button class="chip ${vista === k ? 'on' : ''}" onclick="vista='${k}';giraAbierta=null;pintar()">${esc(t)}${
      k === 'giras' && D.giras.length ? '<b>' + D.giras.length + '</b>' : ''}</button>`).join('');
  if(vista === 'giras'){
    document.getElementById('titulo').textContent = 'Giras';
    document.getElementById('subtitulo').textContent =
      'Cada salida a vender con sus ventas y sus gastos: lo que vendiste, lo que es de la mercadería y lo que te queda a vos.';
    document.getElementById('provs').innerHTML = '';
    document.getElementById('heroes').innerHTML = '';
    pintarGiras();
    return;
  }

  document.getElementById('provs').innerHTML = D.proveedores.length > 1
    ? D.proveedores.map(p => `<button class="chip ${p.id === Pr.id ? 'on' : ''}" onclick="elegido=${p.id};cargar()">${esc(p.nombre)}</button>`).join('')
    : '';

  // Lo que tengo en mano, valuado a lo que le costaría a él y a precio de venta.
  const conStock = D.stock.filter(a => a.en_mano > 0);
  const valorCosto = conStock.reduce((s, a) => s + a.en_mano * a.precio, 0);
  const valorVenta = conStock.reduce((s, a) => s + a.en_mano * precioWeb(a.articulo), 0);
  const unidades = conStock.reduce((s, a) => s + a.en_mano, 0);

  // La cuenta con el proveedor da tres cosas: le debo, estoy al día, o le pagué
  // de más y tengo plata a favor para las próximas ventas.
  const yaPagado = R.pagado ? '<br>Ya le pagaste ' + plata(R.pagado, Pr.moneda) + ' de consignación' : '';
  const heroCuenta = R.debo > 0
    ? `<div class="hero debe">
        <p class="et">Le debés a ${esc(Pr.nombre)} de lo vendido</p>
        <p class="big num">${plata(R.debo, Pr.moneda)}</p>
        <p class="ch">${aPesos(R.debo) && Pr.moneda === 'USD' ? aPesos(R.debo) + ' · ' : ''}${R.u_debo} u. en ${R.ventas_impagas} ${R.ventas_impagas === 1 ? 'venta' : 'ventas'} sin saldar${yaPagado}</p>
      </div>`
    : `<div class="hero aldia">
        <p class="et">${R.a_favor > 0 ? 'Le pagaste de más a ' + esc(Pr.nombre) : 'Estás al día con ' + esc(Pr.nombre)}</p>
        <p class="big num">${R.a_favor > 0 ? plata(R.a_favor, Pr.moneda) + ' a favor' : plata(0, Pr.moneda)}</p>
        <p class="ch">${R.a_favor > 0
          ? 'Se va a descontar solo de las próximas ventas'
          : 'No le debés nada de lo que vendiste'}${yaPagado}</p>
      </div>`;

  document.getElementById('heroes').innerHTML = `
    ${heroCuenta}
    <div class="hero stock">
      <p class="et">Tenés en consignación</p>
      <p class="big num">${plata(valorCosto, Pr.moneda)}</p>
      <p class="ch">${Pr.moneda === 'USD' && aPesos(valorCosto) ? aPesos(valorCosto) + ' · ' : ''}${unidades} u.${valorVenta ? ' · a precio de venta ' + fmt(valorVenta) : ''}</p>
    </div>
    <div class="hero cobrar">
      <p class="et">Te falta cobrar a clientes</p>
      <p class="big num">${fmt(R.por_cobrar)}</p>
      <p class="ch">De las ventas con pedido a su nombre</p>
    </div>`;

  /* ----- stock ----- */
  // De dónde sale cada número: lo que dejó, menos lo vendido y lo devuelto.
  const cuenta = (a) => 'dejó ' + a.dejo + ' · vendiste ' + a.vendio + (a.devolvio ? ' · devolviste ' + a.devolvio : '');
  const negativos = D.stock.filter(a => a.en_mano < 0);
  const filasStock = D.stock.map(a => `<tr>
      <td>${esc(a.articulo)}<span class="g">${plata(a.precio, Pr.moneda)} c/u${precioWeb(a.articulo) ? ' · venta ' + fmt(precioWeb(a.articulo)) : ''}</span></td>
      <td class="${a.en_mano < 0 ? 'neg' : ''}">${a.en_mano} u.<span class="g cta">${cuenta(a)}</span></td>
      <td class="az">${a.en_mano > 0 ? plata(a.en_mano * a.precio, Pr.moneda) : '—'}</td>
      <td>${a.en_mano > 0 && precioWeb(a.articulo) ? fmt(a.en_mano * precioWeb(a.articulo)) : '—'}</td>
    </tr>`).join('');
  const stockHtml = (negativos.length
      ? `<div class="aviso-neg">Ojo: ${negativos.map(a => '<b>' + esc(a.articulo) + '</b>').join(', ')}
          ${negativos.length === 1 ? 'está' : 'están'} en negativo: vendiste más de lo que figura que te dejó.
          Casi seguro falta cargar una entrada: tocá "+ Agregué mercadería" con lo que te dejó ${esc(Pr.nombre)}.</div>`
      : '')
    + (D.stock.length
    ? `<table class="tabla num">
        <thead><tr><th>Línea</th><th>En mano</th><th>Valor ${esc(Pr.nombre)}</th><th>Valor venta</th></tr></thead>
        <tbody>${filasStock}</tbody>
        <tfoot><tr><td>Total</td><td>${unidades} u.</td><td class="az">${plata(valorCosto, Pr.moneda)}</td><td>${valorVenta ? fmt(valorVenta) : '—'}</td></tr></tfoot>
      </table>`
    : '<div class="empty">No tenés mercadería de ' + esc(Pr.nombre) + ' en consignación.</div>');

  const entradas = D.entradas.map(e => `<div class="mov">
      <div><div>${esc(e.articulo)} <b class="${e.cantidad > 0 ? '' : 'neg'}">${e.cantidad > 0 ? '+' : ''}${e.cantidad} u.</b></div>
        <p class="f">${fechaCorta(e.fecha)}${e.nota ? ' · ' + esc(e.nota) : ''}${e.created_at ? ' · cargado el ' + new Date(e.created_at).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : ''}</p></div>
      <div style="display:flex;align-items:center">
        <span class="num">${plata(Math.abs(e.cantidad) * e.precio, Pr.moneda)}</span>
        <button class="x" title="Borrar" onclick="borrarEntrada(${e.id})">×</button>
      </div></div>`).join('');

  /* ----- ventas ----- */
  const totalVendido = D.ventas.reduce((s, v) => s + ventaDe(v), 0);
  const ventasHtml = D.ventas.length
    ? D.ventas.map(v => {
        const items = (v.items || []).map(i => `${i.cantidad}× ${i.articulo}${i.propio ? ' (mío)' : ''}`).join(' · ');
        const venta = ventaDe(v);
        // Lo que vendí de lo mío no es de él: no baja su stock ni le suma deuda.
        const mio = (v.items || []).filter(i => i.propio)
          .reduce((a, i) => a + (Number(i.cantidad) || 0) * (Number(i.precio) || 0), 0);
        const todoMio = (v.items || []).length > 0 && (v.items || []).every(i => i.propio);
        const debe = v.order_id ? Math.max(0, venta - (Number(v.cobrado) || 0)) : 0;
        // Se tacha con lo que se le fue pagando, de la más vieja a la más
        // nueva: por eso una puede quedar a medias (el pago no cerró justo).
        const tags = (todoMio
            ? '<span class="tag gris">Mercadería mía · no es de ' + esc(Pr.nombre) + '</span>'
            : v.resta > 0
              ? (v.pagado > 0
                  ? '<span class="tag al">Le pagaste ' + plata(v.pagado, Pr.moneda) + ' · falta ' + plata(v.resta, Pr.moneda) + '</span>'
                  : '<span class="tag no">Sin pagarle</span>')
              : '<span class="tag ok">' + (v.pagada_at ? 'Le pagaste el ' + fechaCorta(v.pagada_at) : 'Pagada') + '</span>')
          + (mio && !todoMio ? '<span class="tag gris">Incluye ' + fmt(mio) + ' mío</span>' : '')
          + (!v.order_id ? '' : debe > 0 ? '<span class="tag al">Te debe ' + fmt(debe) + '</span>' : '<span class="tag ok">Cobrada</span>')
          + (v.gira_id && giraDe(v.gira_id) ? '<span class="tag gris">' + esc(giraDe(v.gira_id).nombre) + '</span>' : '');
        return `<div class="venta">
          <div>
            <p class="quien ${v.resta > 0 || todoMio ? '' : 'tachada'}">${esc(v.cliente || v.razon_social || v.name || v.email || 'Sin cliente')}</p>
            <p class="f">${fechaCorta(v.fecha)}${v.email ? ' · ' + esc(v.email) : ''}${v.order_id ? ' · pedido #' + v.order_id : ''}${v.nota ? ' · ' + esc(v.nota) : ''}</p>
            <p class="items">${esc(items)}</p>
            <div class="tags">${tags}</div>
          </div>
          <div style="display:flex">
            <div class="plata num">
              <p class="l">A ${esc(Pr.nombre)}</p>
              <p class="v ${v.resta > 0 ? 'rojo' : 'gris'}">${todoMio ? '—' : plata(v.costo, Pr.moneda)}</p>
              <p class="l">Venta</p>
              <p class="v gris">${venta ? fmt(venta) : '—'}</p>
            </div>
            <button class="x" title="Borrar" onclick="borrarVenta(${v.id})">×</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty">Todavía no cargaste ventas. Tocá "Vendí".</div>';

  document.getElementById('cuerpo').innerHTML = `
    <div class="cols">
      <div class="caja">
        <div class="cabe"><h3>Lo que tenés en mano</h3><span class="g">valuado a precio de ${esc(Pr.nombre)} y de venta</span></div>
        ${stockHtml}
        ${D.entradas.length ? `${verEntradas ? entradas : ''}
          <button class="plegar" onclick="verEntradas=!verEntradas;pintar()">
            ${verEntradas ? 'Ocultar movimientos' : 'Ver lo que te dejó y devolviste (' + D.entradas.length + ')'}</button>` : ''}
      </div>
      <div class="caja" style="margin-top:22px">
        <div class="cabe"><h3>Pagos de consignación</h3>
          <span class="g">${D.pagos.length ? 'Total ' + plata(R.pagado, Pr.moneda)
            + (R.debo > 0 ? ' · faltan ' + plata(R.debo, Pr.moneda)
              : R.a_favor > 0 ? ' · ' + plata(R.a_favor, Pr.moneda) + ' a favor' : ' · al día') : ''}</span></div>
        ${D.pagos.length ? D.pagos.map(p => `<div class="mov">
            <div><div>Le pagaste <b>${plata(p.monto, Pr.moneda)}</b></div>
              <p class="f">${fechaCorta(p.fecha)}${p.nota ? ' · ' + esc(p.nota) : ''}${
                p.cubre ? ' · tachó ' + p.cubre + (p.cubre === 1 ? ' venta' : ' ventas') : ''}${
                p.a_cuenta > 0 ? ' · ' + plata(p.a_cuenta, Pr.moneda) + ' a cuenta' : ''}</p></div>
            <button class="x" title="Borrar" onclick="borrarPago(${p.id})">×</button>
          </div>`).join('') : '<div class="empty" style="padding:24px 0">Todavía no le pagaste nada de consignación.</div>'}
      </div>
      <div class="caja">
        <div class="cabe"><h3>Ventas</h3>
          <span class="g">${D.ventas.length ? 'Vendido ' + fmt(totalVendido) + ' · ' + R.vendido_u + ' u.' : ''}</span></div>
        ${ventasHtml}
      </div>
    </div>`;
}

/* ---------- filas de líneas (agregar y vender) ---------- */
function articulos(){
  const nombres = new Map();
  D.stock.forEach(a => nombres.set(a.articulo.toUpperCase(), a.articulo));
  D.precios.forEach(p => { if(!nombres.has(p.articulo.toUpperCase())) nombres.set(p.articulo.toUpperCase(), p.articulo); });
  return [...nombres.values()];
}
const enMano = (art) => { const a = D.stock.find(x => x.articulo.toUpperCase() === String(art).toUpperCase()); return a ? a.en_mano : 0; };
const costoDe = (art) => { const p = D.precios.find(x => x.articulo.toUpperCase() === String(art).toUpperCase()); return p ? Number(p.precio) : 0; };

function renderFilas(){
  const esVenta = modo === 'venta';
  document.getElementById('filas').innerHTML = filas.map((f, i) => {
    const pw = precioWeb(f.articulo);
    // En la venta el precio sale de la tienda. Solo se pide a mano si esa
    // línea no está en la tienda o si es mercadería mía.
    const precio = esVenta
      ? (f.propio || (f.articulo && !pw)
         ? `<input type="number" min="0" placeholder="$ c/u" value="${f.precio || ''}" oninput="filas[${i}].precio=this.value;totalFilas()">`
         : !f.articulo ? '<span class="precio-web">—</span>'
         : `<span class="precio-web">${fmt(pw)} c/u</span>`)
      : `<input type="number" min="0" step="0.01" placeholder="${P().moneda === 'USD' ? 'US$ c/u' : '$ c/u'}" value="${f.precio || ''}" oninput="filas[${i}].precio=this.value;totalFilas()">`;
    return `<div class="qrow" style="grid-template-columns:1fr 74px 104px 26px">
      ${esVenta
        ? (f.propio
          ? `<input type="text" placeholder="Qué le vendiste (tuyo)" value="${esc(f.articulo)}" oninput="filas[${i}].articulo=this.value;totalFilas()">`
          : `<select onchange="elegirVenta(${i},this.value)">
            <option value="">— línea —</option>
            ${articulos().map(a => `<option value="${esc(a)}"${f.articulo === a ? ' selected' : ''}>${esc(a)} (quedan ${enMano(a)})</option>`).join('')}
            <option value="__mio__">+ Algo mío (no es de ${esc(P().nombre)})</option>
          </select>`)
        : `<input type="text" list="artList" placeholder="Línea (ej. CLIPON)" value="${esc(f.articulo)}" onchange="elegirArt(${i},this.value)">`}
      <input type="number" min="1" placeholder="cant." value="${f.cantidad || ''}" oninput="filas[${i}].cantidad=this.value;totalFilas()">
      ${precio}
      <button class="b q ico" style="height:32px;width:26px" onclick="filas.splice(${i},1);renderFilas()">×</button>
    </div>`;
  }).join('')
  + (esVenta ? '' : `<datalist id="artList">${articulos().map(a => `<option value="${esc(a)}">`).join('')}</datalist>`);
  totalFilas();
}
function elegirArt(i, valor){
  const v = String(valor || '').trim();
  const existente = articulos().find(a => a.toUpperCase() === v.toUpperCase());
  filas[i].articulo = existente || v.toUpperCase();
  if(!filas[i].precio && costoDe(filas[i].articulo)) filas[i].precio = costoDe(filas[i].articulo);
  renderFilas();
}
function agregarFila(){ filas.push({ articulo:'', cantidad:'', precio:'' }); renderFilas(); }
// Mercadería mía: el nombre lo escribo yo y el precio también. No sale del
// stock de nadie ni suma deuda, así que en la gira queda toda como ganancia.
function agregarFilaPropia(){ filas.push({ articulo:'', cantidad:1, precio:'', propio:true }); renderFilas(); }
function elegirVenta(i, v){
  if(v === '__mio__') filas[i] = { articulo:'', cantidad: filas[i].cantidad || 1, precio: filas[i].precio || '', propio:true };
  else filas[i].articulo = v;
  renderFilas();
}
const precioVentaFila = (f) => f.propio ? (Number(f.precio) || 0) : (precioWeb(f.articulo) || Number(f.precio) || 0);
function totalFilas(){
  const Pr = P();
  const tot = document.getElementById('fTot');
  const c = document.getElementById('fCosto');
  if(modo === 'agrega'){
    const t = filas.reduce((a, f) => a + (Number(f.cantidad) || 0) * (Number(f.precio) || costoDe(f.articulo)), 0);
    const u = filas.reduce((a, f) => a + (Number(f.cantidad) || 0), 0);
    if(tot) tot.textContent = u + ' u. · ' + plata(t, Pr.moneda);
    return;
  }
  const venta = filas.reduce((a, f) => a + (Number(f.cantidad) || 0) * precioVentaFila(f), 0);
  const costo = filas.reduce((a, f) => a + (f.propio ? 0 : (Number(f.cantidad) || 0) * costoDe(f.articulo)), 0);
  const mio = filas.reduce((a, f) => a + (f.propio ? (Number(f.cantidad) || 0) * precioVentaFila(f) : 0), 0);
  const pasados = filas.filter(f => !f.propio && f.articulo && Number(f.cantidad) > enMano(f.articulo)).map(f => f.articulo);
  if(tot) tot.textContent = fmt(venta);
  if(c) c.innerHTML = 'Le vas a deber a ' + esc(Pr.nombre) + ': <b style="color:var(--no)">' + plata(costo, Pr.moneda) + '</b>'
    + (mio ? '<div>Aparte, ' + fmt(mio) + ' es mercadería tuya: no entra en la cuenta de ' + esc(Pr.nombre) + ' y queda toda para vos.</div>' : '')
    + (pasados.length ? '<div class="aviso-c">Ojo: vendés más de lo que tenés de ' + esc(pasados.join(', ')) + '. Se guarda igual.</div>' : '');
}

/* ---------- agregué mercadería ---------- */
function modalAgrega(){
  const Pr = P();
  modo = 'agrega';
  filas = [{ articulo:'', cantidad:'', precio:'' }];
  abrirModal(`<h3>${esc(Pr.nombre)} me dejó mercadería</h3>
    <p class="sub">Suma a lo que tenés en mano. No es deuda: le debés recién lo que vendés.
      El precio es el de ${esc(Pr.nombre)}; si lo dejás vacío se usa el de su lista.</p>
    <div class="fila">
      <div><label>Cuándo</label><input type="date" id="aFecha" value="${hoyISO()}"></div>
      <div><label>Nota</label><input type="text" id="aNota" placeholder="Reposición, muestras…"></div>
    </div>
    <label>Qué te dejó (por línea)</label>
    <div id="filas"></div>
    <button class="b sm q" onclick="agregarFila()">+ Otra línea</button>
    <div class="qtot"><span>Total</span><span id="fTot"></span></div>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b azul" onclick="guardarAgrega()">Agregar al stock</button></div>`);
  renderFilas();
}
async function guardarAgrega(){
  const items = filas.filter(f => f.articulo && Number(f.cantidad) > 0);
  if(!items.length) return alert('Cargá al menos una línea con cantidad.');
  try{

async function postVenta(venta){
  try{ return await post({ venta }); }
  catch(e){
    if(!/^No te alcanza el stock/.test(e.message)) throw e;
    if(!confirm(e.message + '.\n\n¿La guardás igual? Va a quedar en negativo hasta que cargues lo que te dejó.')) throw new Error('cancelado');
    return post({ venta: Object.assign({}, venta, { forzar: true }) });

/* ---------- le pagué ---------- */
// Se anota cuánta plata le pasé, sin decir de qué ventas es: el pago se
// descuenta de las ventas más viejas hacia las nuevas. Si no cierra justo, la
// última queda a medias; si me paso, queda a favor para las que vengan.
function reparto(monto){
  const pend = D.ventas.filter(v => Number(v.resta) > 0).slice()
    .sort((a, b) => String(a.fecha) < String(b.fecha) ? -1 : String(a.fecha) > String(b.fecha) ? 1 : a.id - b.id);
  const r2 = (n) => Math.round(n * 100) / 100;
  let queda = Math.max(0, Number(monto) || 0);
  const tacha = [];
  let parcial = null;
  for(const v of pend){
    if(queda <= 0.005) break;
    const falta = Number(v.resta);
    if(queda >= falta - 0.005){ tacha.push(v); queda = r2(queda - falta); }
    else { parcial = { v, monto: r2(queda), falta: r2(falta - queda) }; queda = 0; }
  }
  const debe = r2(pend.reduce((a, v) => a + Number(v.resta), 0));
  return { tacha, parcial, aFavor: r2(queda), debe, nuevoDebe: Math.max(0, r2(debe - (Number(monto) || 0))) };
}

// Lo que va a pasar cuando se registre: qué ventas quedan tachadas, cuál a
// medias y cómo queda el saldo.
function pintarPrev(){
  const Pr = P(), monto = Number(document.getElementById('pMonto').value) || 0;
  const rp = reparto(monto);
  const quien = (v) => esc(v.cliente || v.razon_social || v.name || v.email || 'Sin cliente');
  const detalle = (v) => fechaCorta(v.fecha) + ' · ' + esc((v.items || []).map(i => i.cantidad + '× ' + i.articulo).join(' · '));
  document.getElementById('pPrev').innerHTML = monto <= 0 ? '' : `<div class="prev-p">
      ${rp.tacha.map(v => `<div class="pagar-l"><span class="tick">✓</span>
          <span><span class="tachada">${quien(v)}</span><span class="g">${detalle(v)}</span></span>
          <span class="m">${plata(v.resta, Pr.moneda)}</span></div>`).join('')}
      ${rp.parcial ? `<div class="pagar-l"><span class="tick med">◐</span>
          <span>${quien(rp.parcial.v)}<span class="g">${detalle(rp.parcial.v)} · queda a medias, le faltarían ${plata(rp.parcial.falta, Pr.moneda)}</span></span>
          <span class="m med">${plata(rp.parcial.monto, Pr.moneda)}</span></div>` : ''}
      ${!rp.tacha.length && !rp.parcial ? '<p class="nada">No te queda nada sin pagarle: todo esto le queda a favor tuyo para las próximas ventas.</p>' : ''}
    </div>`;
  const resto = rp.nuevoDebe > 0 ? 'Le seguirías debiendo ' + plata(rp.nuevoDebe, Pr.moneda)
    : rp.aFavor > 0 ? plata(rp.aFavor, Pr.moneda) + ' a favor tuyo'
    : 'Al día';
  document.getElementById('pTot').textContent = monto <= 0
    ? (rp.debe > 0 ? 'Le debés ' + plata(rp.debe, Pr.moneda) : 'Estás al día')
    : resto;
}
async function guardarPago(){
  const Pr = P();
  const monto = Number(document.getElementById('pMonto').value) || 0;
  if(monto <= 0) return alert('Poné cuánto le pagaste.');
  const rp = reparto(monto);
  if(rp.aFavor > 0 && !confirm('Le estarías pagando ' + plata(rp.aFavor, Pr.moneda)
      + ' más de lo que le debés.\n\n¿Lo registro igual? Queda a favor tuyo y se descuenta de las próximas ventas.')) return;

/* ---------- vista cliente ---------- */
// Pantalla completa para armar el pedido delante del cliente: un botón por
// línea con el precio de la tienda (se puede cambiar), cantidades y el total.
// No muestra stock, costos ni lo que se le debe al proveedor. Al confirmar se
// guarda igual que "Vendí", con el pago si ya lo hizo, y le llega el mail.
let VC = null;
const MAIL_OK = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const vcPrecio = (l) => { const p = VC.precio[l.art]; return p === undefined ? precioLista(l.art) : (Number(p) || 0); };
const vcElegidas = () => VC.lineas.filter(l => VC.cant[l.art] > 0);
// Mercadería mía: nombre y precio a mano. No es del proveedor, así que no baja
// su stock ni le suma deuda; en la gira queda toda como ganancia.
const vcPropios = () => VC.propios.filter(p => (Number(p.cant) || 0) > 0 && String(p.nombre).trim());
const vcTodo = () => [
  ...vcElegidas().map(l => ({ articulo: l.art, nombre: l.nombre, cant: VC.cant[l.art], precio: vcPrecio(l), propio: false })),
  ...vcPropios().map(p => {
    const nombre = String(p.nombre).trim().slice(0, 80);
    return { articulo: nombre, nombre, cant: Number(p.cant) || 0, precio: Number(p.precio) || 0, propio: true };
  }),
];
const vcBruto = () => vcTodo().reduce((a, x) => a + x.cant * x.precio, 0);
// Descuento en pesos: si es %, sobre el bruto. Nunca más que el total.
const vcDescuento = () => {
  const b = vcBruto(), x = Math.max(0, Number(VC.desc.valor) || 0);
  return Math.min(b, Math.round(VC.desc.tipo === '%' ? b * Math.min(x, 100) / 100 : x));
};
const vcTotal = () => vcBruto() - vcDescuento();
const MEDIOS = ['Efectivo', 'Transferencia', 'Tarjeta', 'Otro'];

function abrirCliente(){
  if(!D || !D.proveedor) return;

    lineas: articulos().filter(a => enMano(a) > 0)

/* paso 1: elegir */
function vcTile(i){
  const l = VC.lineas[i], q = VC.cant[l.art] || 0, pr = vcPrecio(l);
  return `<div class="ln-t ${q ? 'on' : ''}" id="vt${i}" onclick="vcSumar(${i},1,event)">
    <p class="nom">${esc(l.nombre)}</p>
    <label class="pre" onclick="event.stopPropagation()">$<input type="number" min="0" inputmode="numeric"
      class="${q && !pr ? 'falta' : ''}" value="${pr || ''}" placeholder="precio"
      oninput="vcSetPrecio(${i},this.value)"></label>
    <div class="step" onclick="event.stopPropagation()">
      <button onclick="vcSumar(${i},-1)" ${q ? '' : 'disabled'} aria-label="Uno menos">−</button>
      <input type="number" min="0" inputmode="numeric" value="${q}" onfocus="this.select()" onchange="vcSetCant(${i},this.value)">
      <button class="mas-b" onclick="vcSumar(${i},1)" aria-label="Uno más">+</button>
    </div>
    <div class="sub-t">${vcSubtotal(i)}</div>
  </div>`;
}
// Tarjeta de algo mío: el nombre se escribe, el precio también.
function vcTilePropio(j){
  const x = VC.propios[j], q = Number(x.cant) || 0, pr = Number(x.precio) || 0;
  return `<div class="ln-t propio ${q ? 'on' : ''}" id="vp${j}" onclick="vcPropioSumar(${j},1,event)">
    <span class="mio">Mío</span>
    <button class="quitar" title="Sacar" onclick="vcPropioSacar(${j})">×</button>
    <input class="nom-in" type="text" placeholder="¿Qué le vendés?" value="${esc(x.nombre)}"
      onclick="event.stopPropagation()" oninput="vcPropioNombre(${j},this.value)">
    <label class="pre" onclick="event.stopPropagation()">$<input type="number" min="0" inputmode="numeric"
      class="${q && !pr ? 'falta' : ''}" value="${esc(x.precio)}" placeholder="precio"
      oninput="vcPropioPrecio(${j},this.value)"></label>
    <div class="step" onclick="event.stopPropagation()">
      <button onclick="vcPropioSumar(${j},-1)" ${q ? '' : 'disabled'} aria-label="Uno menos">−</button>
      <input type="number" min="0" inputmode="numeric" value="${q}" onfocus="this.select()" onchange="vcPropioCant(${j},this.value)">
      <button class="mas-b" onclick="vcPropioSumar(${j},1)" aria-label="Uno más">+</button>
    </div>
    <div class="sub-t">${vcSubtotalPropio(j)}</div>
  </div>`;
}
function vcSubtotalPropio(j){
  const x = VC.propios[j], q = Number(x.cant) || 0, pr = Number(x.precio) || 0;
  if(q && !String(x.nombre).trim()) return 'Poné qué es';
  return q && pr ? q + ' × ' + fmt(pr) + ' = <b>' + fmt(q * pr) + '</b>' : q ? 'Poné el precio' : '';
}
function vcRepintarPropio(j){
  const el = document.getElementById('vp' + j);
  if(el) el.outerHTML = vcTilePropio(j);
  vcPintarBarra();
}
// Sin repintar la tarjeta, para no perder el foco mientras escribe.
function vcSoloSubtotal(j){
  const el = document.getElementById('vp' + j);
  if(el){
    el.querySelector('.sub-t').innerHTML = vcSubtotalPropio(j);
    const x = VC.propios[j];
    el.querySelector('.pre input').classList.toggle('falta', !!(Number(x.cant) || 0) && !(Number(x.precio) || 0));
    el.classList.toggle('on', (Number(x.cant) || 0) > 0);
  }
  vcPintarBarra();
}
function vcPropioAgregar(){
  VC.propios.push({ nombre:'', precio:'', cant: 1 });
  vcPintar();
  const el = document.querySelector('#vp' + (VC.propios.length - 1) + ' .nom-in');
  if(el) el.focus();
}
function vcPropioSacar(j){ VC.propios.splice(j, 1); vcPintar(); }
function vcPropioNombre(j, v){ VC.propios[j].nombre = v; vcSoloSubtotal(j); }
function vcPropioPrecio(j, v){ VC.propios[j].precio = v; vcSoloSubtotal(j); }
function vcPropioSumar(j, d, ev){
  if(ev && ev.target.closest('input,button,label')) return;
  VC.propios[j].cant = Math.max(0, (Number(VC.propios[j].cant) || 0) + d);
  vcRepintarPropio(j);
}
function vcPropioCant(j, v){
  VC.propios[j].cant = Math.max(0, parseInt(v, 10) || 0);
  vcRepintarPropio(j);
}

function vcSubtotal(i){
  const l = VC.lineas[i], q = VC.cant[l.art] || 0, pr = vcPrecio(l);
  return q && pr ? q + ' × ' + fmt(pr) + ' = <b>' + fmt(q * pr) + '</b>' : q ? 'Poné el precio' : '';
}
function vcRepintarTile(i){
  const el = document.getElementById('vt' + i);
  if(el) el.outerHTML = vcTile(i);
  vcPintarBarra();
}
function vcSumar(i, d, ev){
  if(ev && ev.target.closest('input,button,label')) return;
  const art = VC.lineas[i].art;
  VC.cant[art] = Math.max(0, (VC.cant[art] || 0) + d);
  vcRepintarTile(i);
}
function vcSetCant(i, v){
  VC.cant[VC.lineas[i].art] = Math.max(0, parseInt(v, 10) || 0);
  vcRepintarTile(i);
}
function vcSetPrecio(i, v){
  // Sin repintar la tarjeta, para no perder el foco mientras escribe.
  const l = VC.lineas[i];
  VC.precio[l.art] = v;
  const el = document.getElementById('vt' + i);
  if(el){
    el.querySelector('.sub-t').innerHTML = vcSubtotal(i);
    el.querySelector('.pre input').classList.toggle('falta', !!VC.cant[l.art] && !vcPrecio(l));
  }
  vcPintarBarra();
}

function vcPintarBarra(){
  const el = vcTodo();
  const u = el.reduce((a, x) => a + x.cant, 0);
  const sinNombre = VC.propios.some(x => (Number(x.cant) || 0) > 0 && !String(x.nombre).trim());
  const sinPrecio = el.some(x => !x.precio);
  const res = el.length
    ? u + (u === 1 ? ' unidad' : ' unidades') + ' · ' + el.map(x => x.cant + '× ' + esc(x.nombre)).join(' · ')
    : 'Todavía no elegiste nada';
  const falta = sinNombre ? 'Falta un nombre' : sinPrecio ? 'Falta un precio' : '';
  const botones = VC.paso === 'elegir'
    ? `<button class="go" onclick="vcIr('confirmar')" ${el.length && !falta ? '' : 'disabled'}>${falta || 'Continuar →'}</button>`
    : `<button class="go sec" onclick="vcIr('elegir')" title="Cambiar">←<span class="tx"> Cambiar</span></button>
       <button class="go" id="vcOk" onclick="vcGuardar()">Confirmar pedido</button>`;
  document.getElementById('vcBar').innerHTML = `<div class="vc-in">
    <div class="res">${res}</div>
    <div class="tot"><small>Total</small><b class="num">${fmt(vcTotal())}</b></div>

}

  if(VC.pago !== 'si') return;
  const auto = VC.pagos.findIndex(p => p.auto);
  if(auto >= 0){
    const otros = VC.pagos.reduce((a, p, j) => a + (j === auto ? 0 : Math.round(Number(p.monto) || 0)), 0);
    VC.pagos[auto].monto = String(Math.max(0, vcTotal() - otros));
    const inp = document.getElementById('vcPm' + auto);
    if(inp) inp.value = VC.pagos[auto].monto;

  if(est) est.outerHTML = vcPagoEstadoHtml();
}

  const t = vcTotal(), p = vcPagado();
  const [cls, txt] = p === t ? ['ok', '✓ Pagó todo: ' + fmt(t)]
    : p > t ? ['mal', 'Se pasa por ' + fmt(p - t)]
    : ['al', 'Pagó ' + fmt(p) + ' · queda debiendo ' + fmt(t - p)];
  return `<div class="pg-estado ${cls}" id="vcPagoEstado">${txt}</div>`;

async function vcGuardar(){
  const email = VC.email.trim();
  const hayMail = MAIL_OK.test(email);
  if(email && !hayMail) return alert('Ese mail no parece válido.');
  const total = vcTotal(), descuento = vcDescuento();
  const cobros = VC.pago === 'si'
    ? VC.pagos.map(p => ({ medio: p.medio, monto: Math.round(Number(p.monto) || 0) })).filter(p => p.monto > 0)
    : [];
  const monto = cobros.reduce((a, p) => a + p.monto, 0);
  if(VC.pago === 'si'){
    if(monto <= 0) return alert('Poné cuánto pagó.');
    if(monto > total) return alert('Los pagos suman ' + fmt(monto) + ' y el total es ' + fmt(total) + '.');
  }
  const items = vcTodo().map(x => ({ articulo: x.articulo, nombre: x.nombre, cantidad: x.cant, precio: x.precio, propio: x.propio }));
  const btn = document.getElementById('vcOk');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
  try{
    const r = await postVenta({
      email, cliente: VC.nombre, fecha: hoyISO(), nota: '', items, descuento, cobros,
      mandarMail: hayMail && VC.mail });
    const partes = [(r.order_id ? 'Pedido #' + r.order_id + ' · ' : '') + fmt(total) + (descuento ? ' (con ' + fmt(descuento) + ' de descuento)' : '')];
    if(monto) partes.push((monto >= total ? 'Pagado' : 'Pagó ' + fmt(monto) + ' · quedan ' + fmt(total - monto))
      + (cobros.length > 1 ? ': ' + cobros.map(p => esc(p.medio) + ' ' + fmt(p.monto)).join(' + ') : ' en ' + esc(cobros[0].medio).toLowerCase()));
    if(hayMail && VC.mail) partes.push(r.mail ? 'Te mandamos el detalle a ' + esc(email) : 'No se pudo mandar el mail');
    VC.resultado = partes.join('<br>');
    VC.paso = 'listo';
    vcPintar();
    cargar();
  }catch(e){
    if(e.message !== 'cancelado') alert(e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Confirmar pedido'; }
  }
}

/* ---------- giras ---------- */
// Una gira junta las ventas de una salida (de cualquier proveedor) y sus
// gastos. Lo que queda = vendido − lo que es de la mercadería − gastos.
// La mercadería en dólares se pasa a pesos con la cotización de hoy.
const giraDe = (id) => (D.giras || []).find(g => g.id === id);
const GASTOS = ['Nafta', 'Peaje', 'Hotel', 'Comida', 'Otro'];
const unidadesDe = (v) => (v.items || []).reduce((a, it) => a + (Number(it.cantidad) || 0), 0);
const clienteDe = (v) => v.cliente || v.razon_social || v.name || v.email || 'Sin cliente';
const conSigno = (n) => n < 0 ? '−' + fmt(-n) : fmt(n);
const rangoGira = (g) => fechaCorta(g.desde) + (g.hasta ? ' al ' + fechaCorta(g.hasta) : ' · en curso');

function resumenGira(g){
  const ventas = D.ventasGira.filter(v => v.gira_id === g.id);
  const vendido = ventas.reduce((a, v) => a + ventaDe(v), 0);
  const medios = {};
  ventas.forEach(v => (v.cobros || []).forEach(c => {
    const m = c.medio || 'Sin decir';
    medios[m] = (medios[m] || 0) + (Number(c.monto) || 0);
  }));
  const cobrado = Object.values(medios).reduce((a, n) => a + n, 0);
  // La mercadería: en la moneda de cada proveedor, y todo junto en pesos.
  const usdT = ventas.filter(v => v.moneda === 'USD').reduce((a, v) => a + v.costo, 0);
  const arsT = ventas.filter(v => v.moneda !== 'USD').reduce((a, v) => a + v.costo, 0);
  const mercaderia = arsT + usdT * tasa();
  // De lo vendido, lo que era mercadería mía: no se le debe a nadie, así que
  // entra entero en lo que queda.
  const propio = Math.min(vendido, ventas.reduce((a, v) => a + (v.items || []).filter(i => i.propio)
    .reduce((b, i) => b + (Number(i.cantidad) || 0) * (Number(i.precio) || 0), 0), 0));
  const gastos = (g.gastos || []).reduce((a, x) => a + Number(x.monto), 0);
  const gastosMedio = {};
  (g.gastos || []).forEach(x => { const m = x.medio || 'Sin decir'; gastosMedio[m] = (gastosMedio[m] || 0) + Number(x.monto); });
  return { ventas, vendido, medios, cobrado, falta: Math.max(0, vendido - cobrado), usdT, arsT, mercaderia, propio,
    gastos, gastosMedio, queda: vendido - mercaderia - gastos,
    unidades: ventas.reduce((a, v) => a + unidadesDe(v), 0),
    sinTasa: usdT > 0 && !tasa() };
}

        <input type="checkbox" value="${v.id}" ${v.gira_id === g.id ? 'checked' : ''}>
        <span>${esc(clienteDe(v))}
          <span class="g">${fechaCorta(v.fecha)}${enFechas(v) ? '' : ' · fuera de las fechas'} · ${esc((v.items || []).map(i => i.cantidad + '× ' + i.articulo).join(' · '))}</span></span>
        <span class="m">${fmt(ventaDe(v))}</span>
      </label>`).join('')}</div>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarGiraVentas(${g.id})">Guardar</button></div>`);
}
async function guardarGiraVentas(giraId){
  const ventas = [...document.querySelectorAll('#gvLista input:checked')].map(x => parseInt(x.value, 10));
  try{ await post({ giraVentas:{ id: giraId, ventas } }); cerrarModal(); showToast('Listo'); await cargar(); }
  catch(e){ alert(e.message); }
}

/* ---------- borrar ---------- */
async function borrarVenta(id){
  if(!confirm('¿Borrar esta venta? Se borra también el pedido del cliente, sus cobros y lo que sumó a la deuda.'
    + '\n\nSi ya estaba tachada, lo que le pagaste pasa a la venta siguiente sin saldar.')) return;
  try{ await post({ borrarVenta: id }); showToast('Borrada'); await cargar(); }
  catch(e){ alert(e.message); }
}
async function borrarPago(id){
  if(!confirm('¿Borrar este pago? La cuenta se rehace: las últimas ventas que cubría vuelven a quedar sin pagar.')) return;
  try{ await post({ borrarPago: id }); showToast('Pago borrado'); await cargar(); }
  catch(e){ alert(e.message); }
}
async function borrarEntrada(id){
  if(!confirm('¿Borrar este movimiento de mercadería?')) return;
  try{ await post({ borrarEntrada: id }); showToast('Borrado'); await cargar(); }
  catch(e){ alert(e.message); }
}

async function post(body){
  return api('/api/consignacion', { method:'POST',
    body: JSON.stringify(Object.assign({ supplier_id: D.proveedor.id }, body)) });
}

bootPanel(cargar);
</script>
