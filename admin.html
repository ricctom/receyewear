<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Panel · REC Eyewear</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Montserrat',Arial,sans-serif;margin:0;background:#f6f6f6;color:#222;font-size:14px}
  header{background:#000;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{font-size:16px;margin:0;letter-spacing:1px;text-transform:uppercase}
  .who{font-size:12px;color:#ccc;display:flex;align-items:center;gap:10px}
  .who button{background:none;border:1px solid #555;color:#ddd;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .wrap{max-width:1050px;margin:24px auto;padding:0 16px}
  .gate{max-width:420px;margin:12vh auto;background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:32px;text-align:center}
  .gate h2{font-size:18px;margin:0 0 6px}
  .gate p{color:#777;margin:0 0 22px;font-size:13px}
  #gbtn{display:flex;justify-content:center}
  .msg{color:#c0392b;font-size:13px;margin-top:16px;min-height:18px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .toolbar .stats{font-size:13px;color:#666}
  .refresh{background:#000;color:#fff;border:none;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
  .order{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .order-id{font-weight:700}
  .order-meta{font-size:12px;color:#888;margin-top:2px}
  .order-total{font-weight:700;font-size:15px}
  .items{margin:10px 0 0;padding:10px 0 0;border-top:1px dashed #eee;font-size:13px}
  .items div{padding:2px 0;color:#444}
  .items .col{color:#0f7a3d;font-weight:600}
  .st{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .st.nuevo{background:#fdecea;color:#c0392b}
  .st.preparando{background:#fff4e0;color:#b9770e}
  .st.enviado{background:#e7f0fd;color:#1c5fb0}
  .st.entregado{background:#e6f5ec;color:#0f7a3d}
  .st.cancelado{background:#eee;color:#888}
  select.status{margin-top:8px;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#fff;cursor:pointer}
  .pdfbtn{margin-top:8px;margin-left:6px;padding:6px 11px;border:1px solid #222;background:#fff;color:#222;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
  .pdfbtn:hover{background:#222;color:#fff}
  .actions{display:flex;flex-wrap:wrap;gap:0;justify-content:flex-end}
  /* Editor de items */
  .editor{margin-top:12px;padding-top:12px;border-top:1px dashed #eee}
  .editor .hint{font-size:12px;color:#777;margin:0 0 8px;line-height:1.5}
  .editor .hint code{background:#f0f0f0;padding:1px 5px;border-radius:4px;font-size:11px}
  .editor textarea{width:100%;min-height:220px;font-family:Consolas,'Courier New',monospace;font-size:12px;line-height:1.55;border:1px solid #ddd;border-radius:8px;padding:10px;resize:vertical}
  .editor .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .editor .calc{font-size:12px;color:#444}
  .editor .calc b{font-size:13px}
  .editor .err{color:#c0392b}
  .editor .btns{display:flex;gap:8px}
  .editor .btns button{padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #ccc;background:#fff;color:#444}
  .editor .btns button.save{background:#000;color:#fff;border-color:#000}
  .empty{text-align:center;color:#999;padding:50px 0}
  a.back{color:#888;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>REC Eyewear · Pedidos</h1>
  <div class="who" id="who"></div>
</header>

<!-- Login -->
<div class="wrap" id="gate">
  <div class="gate">
    <h2>Panel de administración</h2>
    <p>Iniciá sesión con la cuenta de Google autorizada.</p>
    <div id="gbtn"></div>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<!-- Pedidos -->
<div class="wrap" id="panel" style="display:none">
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <button class="refresh" onclick="loadOrders()">↻ Actualizar</button>
  </div>
  <div id="list"></div>
</div>

<script>
const fmt = n => '$' + (n||0).toLocaleString('es-AR');
const STATES = ['nuevo','preparando','enviado','entregado','cancelado'];
let session = JSON.parse(localStorage.getItem('rec4_session') || 'null');
let ORDERS = [];

function saveSession(s){ session = s; localStorage.setItem('rec4_session', JSON.stringify(s)); }
function logout(){ localStorage.removeItem('rec4_session'); location.reload(); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(session && session.token) headers['Authorization'] = 'Bearer ' + session.token;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || ('Error ' + r.status));
  return data;
}

async function onCredential(resp){
  document.getElementById('gateMsg').textContent = '';
  try{
    const data = await api('/api/auth', { method:'POST', body: JSON.stringify({ credential: resp.credential }) });
    if(!data.user.admin){ document.getElementById('gateMsg').textContent = 'Esa cuenta no tiene acceso al panel.'; return; }
    saveSession(data);
    showPanel();
  }catch(e){ document.getElementById('gateMsg').textContent = e.message; }
}

async function initGoogle(){
  try{
    const cfg = await api('/api/config');
    if(!cfg.googleClientId){ document.getElementById('gateMsg').textContent = 'Falta configurar GOOGLE_CLIENT_ID.'; return; }
    const start = () => {
      google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: onCredential });
      google.accounts.id.renderButton(document.getElementById('gbtn'), { theme:'filled_black', size:'large', text:'signin_with', shape:'pill' });
    };
    if(window.google && google.accounts) start();
    else { const t=setInterval(()=>{ if(window.google&&google.accounts){clearInterval(t);start();} }, 150); }
  }catch(e){ document.getElementById('gateMsg').textContent = e.message; }
}

function showPanel(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('who').innerHTML =
    (session.user.name || session.user.email) + ' <button onclick="logout()">Salir</button>';
  loadOrders();
}

async function loadOrders(){
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty">Cargando…</div>';
  try{
    const { orders } = await api('/api/admin');
    ORDERS = orders;
    document.getElementById('stats').textContent = orders.length + ' pedido(s)';
    if(!orders.length){ list.innerHTML = '<div class="empty">Todavía no hay pedidos.</div>'; return; }
    list.innerHTML = orders.map(renderOrder).join('');
  }catch(e){
    if(String(e.message).includes('admin')||String(e.message).includes('sesión')) return logout();
    list.innerHTML = '<div class="empty">'+e.message+'</div>';
  }
}

function renderOrder(o){
  const d = new Date(o.created_at);
  const fecha = d.toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  const items = (o.items||[]).map(it =>
    `<div>• ${esc(it.name)}${it.color?` <span class="col">— ${esc(it.color)}</span>`:''} × ${it.qty} = ${fmt(it.price*it.qty)}</div>`).join('');
  const opts = STATES.map(s => `<option value="${s}"${s===o.status?' selected':''}>${s}</option>`).join('');
  return `<div class="order">
    <div class="order-top">
      <div>
        <span class="order-id">#${o.id}</span> <span class="st ${o.status}">${o.status}</span>
        <div class="order-meta">${esc(o.name||'')} · ${esc(o.email)} · ${fecha}</div>
      </div>
      <div style="text-align:right">
        <div class="order-total">${fmt(o.total)}</div>
        <select class="status" onchange="setStatus(${o.id}, this.value)">${opts}</select>
        <div class="actions">
          <button class="pdfbtn" onclick="exportProveedorPDF(${o.id})" title="Unidades por línea, sin precios ni datos del cliente">📦 PDF proveedor</button>
          <button class="pdfbtn" onclick="exportClientePDF(${o.id})" title="Con los datos del cliente y los precios">🧾 PDF cliente</button>
          <button class="pdfbtn" onclick="toggleEditor(${o.id})" title="Agregar, sacar o corregir items del pedido">✏️ Editar</button>
        </div>
      </div>
    </div>
    <div class="items">${items}</div>
    <div class="editor" id="ed-${o.id}" style="display:none">
      <p class="hint">Un item por renglón: <code>Línea (MODELO) | Color | Cantidad | Precio</code><br>
        Borrá renglones para sacar items, agregá renglones para sumarlos. El total se recalcula solo al guardar.</p>
      <textarea id="tx-${o.id}" spellcheck="false" oninput="recalcEditor(${o.id})">${esc(itemsToText(o.items||[]))}</textarea>
      <div class="foot">
        <div class="calc" id="calc-${o.id}"></div>
        <div class="btns">
          <button onclick="toggleEditor(${o.id})">Cancelar</button>
          <button class="save" onclick="saveItems(${o.id})">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function setStatus(id, status){
  try{ await api('/api/admin', { method:'POST', body: JSON.stringify({ id, status }) }); loadOrders(); }
  catch(e){ alert(e.message); }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Editor de items ----------------------------------------------
   El pedido se edita como texto plano, un item por renglón:
       Línea (MODELO) | Color | Cantidad | Precio
   Así se pueden sacar items (borrando el renglón) o agregar modelos que
   todavía no están en el catálogo. El total lo recalcula el server. */

const NL = '\n';

function itemsToText(items){
  return (items||[]).map(it =>
    `${it.name} | ${it.color || ''} | ${it.qty} | ${it.price}`).join(NL);
}

function textToItems(txt){
  const items = [], errores = [];
  String(txt||'').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if(!line || line.startsWith('#')) return;
    const p = line.split('|').map(x => x.trim());
    if(p.length < 4){ errores.push(`Renglón ${i+1}: faltan campos (van 4 separados por |)`); return; }
    const name = p[0];
    const color = p[1];
    const qty = parseInt(p[2], 10);
    const price = Number(String(p[3]).replace(/[^\d.-]/g, ''));
    if(!name){ errores.push(`Renglón ${i+1}: falta el nombre`); return; }
    if(!(qty > 0)){ errores.push(`Renglón ${i+1}: cantidad inválida`); return; }
    if(!isFinite(price) || price < 0){ errores.push(`Renglón ${i+1}: precio inválido`); return; }
    const m = name.match(/\(([^)]+)\)\s*$/);
    items.push({ sku: m ? m[1].trim() : '', name, color: color || null, qty, price });
  });
  if(!items.length && !errores.length) errores.push('El pedido no puede quedar vacío');
  return { items, errores };
}

function recalcEditor(id){
  const box = document.getElementById('calc-' + id);
  const { items, errores } = textToItems(document.getElementById('tx-' + id).value);
  if(errores.length){ box.innerHTML = '<span class="err">' + esc(errores[0]) + '</span>'; return; }
  const u = items.reduce((a,it) => a + it.qty, 0);
  const t = items.reduce((a,it) => a + it.qty * it.price, 0);
  box.innerHTML = `${items.length} renglón(es) · ${u} unidades · total <b>${fmt(t)}</b>`;
}

function toggleEditor(id){
  const ed = document.getElementById('ed-' + id);
  const abierto = ed.style.display !== 'none';
  if(abierto){ ed.style.display = 'none'; return; }
  document.getElementById('tx-' + id).value = itemsToText((ORDERS.find(o => o.id === id) || {}).items);
  ed.style.display = 'block';
  recalcEditor(id);
}

async function saveItems(id){
  const { items, errores } = textToItems(document.getElementById('tx-' + id).value);
  if(errores.length){ alert('Revisá el pedido:' + NL + NL + errores.join(NL)); return; }
  const u = items.reduce((a,it) => a + it.qty, 0);
  const t = items.reduce((a,it) => a + it.qty * it.price, 0);
  if(!confirm(`Guardar el pedido #${id} con ${items.length} renglón(es), ${u} unidades y un total de ${fmt(t)}?`)) return;
  try{
    await api('/api/admin', { method:'POST', body: JSON.stringify({ id, items }) });
    loadOrders();
  }catch(e){ alert(e.message); }
}

// Separa "Metal Receta Diseño (MS18)" -> { linea:'Metal Receta Diseño', modelo:'MS18' }
function splitNombre(name){
  const s = String(name || '').trim();
  const m = s.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if(m) return { linea: m[1].trim() || 'Sin línea', modelo: m[2].trim() };
  return { linea: s || 'Sin línea', modelo: '' };
}

// PDF para el PROVEEDOR: solo unidades por línea (Modelo · Color · Cantidad),
// sin precios ni datos del cliente. Hoja angosta tipo ticket, cómoda para el celu.
function exportProveedorPDF(id){
  const o = ORDERS.find(x => x.id === id);
  if(!o){ alert('No se encontró el pedido.'); return; }

  // Agrupar por línea, y dentro por (modelo + color)
  const lineas = new Map(); // linea -> Map(clave -> {modelo,color,qty})
  (o.items || []).forEach(it => {
    const { linea, modelo } = splitNombre(it.name);
    const mod = it.sku ? String(it.sku) : modelo;
    const color = it.color ? String(it.color) : '';
    const qty = Math.max(1, parseInt(it.qty, 10) || 1);
    if(!lineas.has(linea)) lineas.set(linea, new Map());
    const g = lineas.get(linea);
    const key = mod + '¬' + color;
    if(g.has(key)) g.get(key).qty += qty;
    else g.set(key, { modelo: mod, color, qty });
  });

  let totalGeneral = 0;
  const bloques = [...lineas.entries()].map(([linea, g]) => {
    const filas = [...g.values()].sort((a,b) =>
      a.modelo.localeCompare(b.modelo) || a.color.localeCompare(b.color));
    const subtotal = filas.reduce((s,f) => s + f.qty, 0);
    totalGeneral += subtotal;
    const trs = filas.map(f => `<tr>
      <td>${esc(f.modelo || '—')}</td>
      <td>${esc(f.color || '—')}</td>
      <td class="q">${f.qty}</td></tr>`).join('');
    return `<section class="linea">
      <h2>${esc(linea)} <span class="ln-total">${subtotal} u.</span></h2>
      <table>
        <thead><tr><th>Modelo</th><th>Color</th><th class="q">Cant.</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </section>`;
  }).join('');

  const d = new Date(o.created_at);
  const fecha = d.toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  const html = `<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Pedido #${o.id} · REC Eyewear</title>
<style>
  *{box-sizing:border-box}
  /* Hoja angosta tipo ticket: cómoda para ver/bajar en el celular */
  @page{size:105mm auto;margin:7mm 6mm}
  body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;padding:16px;font-size:12px;max-width:105mm}
  .head{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:16px}
  .head h1{font-size:17px;margin:0;letter-spacing:.5px;text-transform:uppercase}
  .head .meta{font-size:11px;color:#555;margin-top:3px}
  .linea{margin:0 0 15px;break-inside:avoid}
  .linea h2{font-size:13px;margin:0 0 5px;padding-bottom:4px;border-bottom:1px solid #bbb;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ln-total{font-size:11px;font-weight:700;background:#111;color:#fff;padding:2px 8px;border-radius:12px;white-space:nowrap}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:4px 4px;border-bottom:1px solid #eee;vertical-align:top}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#666;border-bottom:1px solid #ccc}
  td.q,th.q{text-align:right;width:40px;white-space:nowrap}
  .grand{margin-top:18px;border-top:2px solid #111;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
  .grand .n{font-size:18px}
  @media print{ body{padding:0} .noprint{display:none} }
  .noprint{margin-bottom:14px}
  .noprint button{font-size:13px;padding:9px 14px;border:1px solid #111;background:#111;color:#fff;border-radius:6px;cursor:pointer;width:100%}
</style></head><body>
  <div class="noprint"><button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button></div>
  <div class="head">
    <h1>Pedido #${o.id}</h1>
    <div class="meta">REC Eyewear · ${fecha}</div>
  </div>
  ${bloques || '<p>El pedido no tiene ítems.</p>'}
  <div class="grand"><span>Total de unidades</span><span class="n">${totalGeneral}</span></div>
  <script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script>
</body></html>`;

  abrirParaImprimir(html);
}

function abrirParaImprimir(html){
  const w = window.open('', '_blank');
  if(!w){ alert('Permití las ventanas emergentes para exportar el PDF.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

// PDF para el CLIENTE: datos del cliente + items con precio unitario, subtotal
// por renglón, subtotal por línea y total del pedido. Hoja A4.
function exportClientePDF(id){
  const o = ORDERS.find(x => x.id === id);
  if(!o){ alert('No se encontró el pedido.'); return; }

  // Agrupar por línea, y dentro por (modelo + color + precio)
  const lineas = new Map();
  (o.items || []).forEach(it => {
    const { linea, modelo } = splitNombre(it.name);
    const mod = it.sku ? String(it.sku) : modelo;
    const color = it.color ? String(it.color) : '';
    const qty = Math.max(1, parseInt(it.qty, 10) || 1);
    const price = Number(it.price) || 0;
    if(!lineas.has(linea)) lineas.set(linea, new Map());
    const g = lineas.get(linea);
    const key = mod + '¬' + color + '¬' + price;
    if(g.has(key)) g.get(key).qty += qty;
    else g.set(key, { modelo: mod, color, qty, price });
  });

  let totalUnidades = 0, totalPesos = 0;
  const bloques = [...lineas.entries()].map(([linea, g]) => {
    const filas = [...g.values()].sort((a,b) =>
      a.modelo.localeCompare(b.modelo) || a.color.localeCompare(b.color));
    const subU = filas.reduce((s,f) => s + f.qty, 0);
    const subP = filas.reduce((s,f) => s + f.qty * f.price, 0);
    totalUnidades += subU; totalPesos += subP;
    const trs = filas.map(f => `<tr>
      <td>${esc(f.modelo || '—')}</td>
      <td>${esc(f.color || '—')}</td>
      <td class="q">${f.qty}</td>
      <td class="m">${fmt(f.price)}</td>
      <td class="m">${fmt(f.qty * f.price)}</td></tr>`).join('');
    return `<section class="linea">
      <h2>${esc(linea)}</h2>
      <table>
        <thead><tr><th>Modelo</th><th>Color</th><th class="q">Cant.</th><th class="m">P. unit.</th><th class="m">Subtotal</th></tr></thead>
        <tbody>${trs}</tbody>
        <tfoot><tr><td colspan="2">Subtotal ${esc(linea)}</td><td class="q">${subU}</td><td class="m"></td><td class="m">${fmt(subP)}</td></tr></tfoot>
      </table>
    </section>`;
  }).join('');

  const d = new Date(o.created_at);
  const fecha = d.toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  const html = `<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Pedido #${o.id} · ${esc(o.name || o.email || 'Cliente')}</title>
<style>
  *{box-sizing:border-box}
  @page{size:A4;margin:14mm 12mm}
  body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;padding:20px;font-size:12px;max-width:190mm}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
  .head h1{font-size:20px;margin:0;letter-spacing:.5px;text-transform:uppercase}
  .head .marca{font-size:12px;color:#555;margin-top:3px;letter-spacing:1px;text-transform:uppercase}
  .head .der{text-align:right;font-size:11px;color:#555;line-height:1.6}
  .cliente{background:#f5f5f5;border:1px solid #e2e2e2;border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:12px;line-height:1.7}
  .cliente .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#777;display:block}
  .cliente .nom{font-size:14px;font-weight:700;text-transform:uppercase}
  .linea{margin:0 0 16px;break-inside:avoid}
  .linea h2{font-size:13px;margin:0 0 5px;text-transform:uppercase;letter-spacing:.4px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #eee;vertical-align:top}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#666;border-bottom:1px solid #999}
