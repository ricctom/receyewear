<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Pedidos · REC Eyewear</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="panel.css"/>
</head>
<body>
<header>
  <h1>REC</h1>
  <nav class="tabs">
    <a href="admin.html" class="on">Pedidos</a>
    <a href="crm.html">Clientes</a>
    <a href="proveedor.html">Martín</a>
  </nav>
  <div class="who" id="who"></div>
</header>

<div class="wrap" id="gate">
  <div class="gate">
    <h2>Pedidos</h2>
    <p>Entrá con la cuenta de Google de siempre.</p>
    <div id="gbtn"></div>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<div class="wrap" id="panel" style="display:none">
  <div class="top">
    <div>
      <h2 id="titulo">Pedidos</h2>
      <div class="sub" id="subtitulo"></div>
    </div>
    <div class="der">
      <button class="b sm q" id="usdBtn" onclick="editarDolar()"></button>
      <button class="b sm q ico" onclick="cargar()" title="Actualizar">↻</button>
    </div>
  </div>
  <div class="resumen" id="resumen"></div>
  <div class="filtros" id="filtros"></div>
  <div id="avisoMartin"></div>
  <div id="avisoCostos"></div>
  <div id="lista"></div>
</div>

<div class="modal-ov" id="ov" onclick="cerrarModal()"></div>
<div class="modal" id="modal"><div id="modalBody"></div></div>

<script src="panel.js"></script>
<script>
/* Cada pedido está en UN paso y muestra UNA acción. Lo demás se calla. */
const PASOS = {
  nuevo:      { txt:'Sin mandar a Martín', accion:'Pasar a Martín',  sig:'pedido' },
  pedido:     { txt:'Esperando a Martín',  accion:'Llegó tal cual',  sig:'recibido' },
  recibido:   { txt:'Listo para despachar',accion:'Despachado',      sig:'despachado' },
  despachado: { txt:'Despachado',          accion:'Me pagó todo',    sig:null },
  saldado:    { txt:'Saldado',             accion:null,              sig:null },
  cancelado:  { txt:'Cancelado',           accion:null,              sig:null },
};
const FALTANTE_TXT = {
  cambiar: 'Si falta algo, cambiarlo por otro parecido',
  consultar: 'Si falta algo, consultarle antes',
  baja: 'Si falta algo, darlo de baja',
};
const VISTAS = [
  ['pendientes', 'Pendientes'],
  ['nuevo',      'Para mandar'],
  ['pedido',     'En Martín'],
  ['recibido',   'Para despachar'],
  ['cobrar',     'Por cobrar'],
  ['saldado',    'Saldados'],
];

let ORDERS = [], USD = { valor:0 }, ARTICULOS = [], SIN_MAPEAR = [], COSTMAP = [];
let vista = 'pendientes';
const abiertos = new Set();

async function cargar(){
  const lista = document.getElementById('lista');
  if(!ORDERS.length) lista.innerHTML = '<div class="empty">Cargando…</div>';
  try{
    const d = await api('/api/admin');
    ORDERS = d.orders; USD = d.usd || { valor:0 };
    ARTICULOS = d.articulos || []; SIN_MAPEAR = d.sin_mapear || []; COSTMAP = d.cost_map || [];
    pintar();
  }catch(e){
    if(esSesion(e)) return logout();
    lista.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

/* ---------- cuentas ---------- */
const cobrado = o => Number(o.cobrado) || 0;
const debe    = o => Math.max(0, o.total - cobrado(o));
const dolar   = o => Number(o.usd_rate) || Number(USD.valor) || 0;
const costo   = o => Math.round((Number(o.costo_usd) || 0) * dolar(o) + (Number(o.costo_ars) || 0));
const ganancia= o => o.total - costo(o);

// El paso "visible": un pedido despachado y cobrado ya no molesta.
function paso(o){
  if(o.etapa === 'cancelado') return 'cancelado';
  if(o.etapa === 'despachado' && debe(o) <= 0) return 'saldado';
  return o.etapa || 'nuevo';
}
function enVista(o, v){
  const p = paso(o);
  if(v === 'pendientes') return p !== 'saldado' && p !== 'cancelado';
  if(v === 'cobrar') return p !== 'cancelado' && debe(o) > 0 && (p === 'despachado' || p === 'saldado');
  if(v === 'saldado') return p === 'saldado' || p === 'cancelado';
  return p === v;
}

/* ---------- pintar ---------- */
function pintar(){
  const vivos = ORDERS.filter(o => o.etapa !== 'cancelado');
  const porCobrar = vivos.filter(o => ['despachado','saldado'].includes(paso(o)))
                         .reduce((a,o) => a + debe(o), 0);
  const enMartin = vivos.filter(o => paso(o) === 'pedido').length;
  const paraDespachar = vivos.filter(o => paso(o) === 'recibido').length;

  document.getElementById('subtitulo').textContent =
    vivos.length + (vivos.length === 1 ? ' pedido' : ' pedidos') + ' · ' +
    (porCobrar ? fmt(porCobrar) + ' sin cobrar' : 'todo cobrado');

  document.getElementById('usdBtn').innerHTML =
    'Dólar ' + (USD.valor ? Number(USD.valor).toLocaleString('es-AR') : '—');

  document.getElementById('resumen').innerHTML = `
    <div><p class="r1">Te deben</p><p class="r2 ${porCobrar ? 'debe' : 'ok'}">${porCobrar ? fmt(porCobrar) : 'nada'}</p></div>
    <div><p class="r1">En Martín</p><p class="r2">${enMartin}</p></div>
    <div><p class="r1">Para despachar</p><p class="r2">${paraDespachar}</p></div>`;

  document.getElementById('filtros').innerHTML = VISTAS.map(([k,t]) => {
    const n = ORDERS.filter(o => enVista(o,k)).length;
    if(!n && k !== vista && k !== 'pendientes') return '';
    return `<button class="chip${vista===k?' on':''}" onclick="verVista('${k}')">${t}<b>${n}</b></button>`;
  }).join('');

  // Pedidos que ya despachaste pero que nunca se le cargaron a Martín
  // (los que venían de antes y se migraron salteando ese paso).
  const sinCargar = ORDERS.filter(o => !o.supplier_move_id &&
    ['recibido','despachado','saldado'].includes(paso(o)));
  document.getElementById('avisoMartin').innerHTML = sinCargar.length
    ? `<div class="aviso">${sinCargar.length === 1 ? 'Hay 1 pedido que ya retiraste y' : 'Hay ' + sinCargar.length + ' pedidos que ya retiraste y'}
        todavía no ${sinCargar.length === 1 ? 'está cargado' : 'están cargados'} en la cuenta de Martín:
        <b>${sinCargar.map(o => '#' + o.id).join(', ')}</b>.
        <button class="b sm" style="margin-left:6px" onclick="cargarPendientesMartin()">Cargarlos ahora</button></div>` : '';

  const av = document.getElementById('avisoCostos');
  av.innerHTML = SIN_MAPEAR.length
    ? `<div class="aviso">No sé cuánto te cuestan estas líneas: <b>${SIN_MAPEAR.map(esc).join(', ')}</b>.
        Sin eso no puedo calcular la deuda con Martín.
        <button class="b sm" style="margin-left:6px" onclick="editarCostos()">Asignarlas</button></div>` : '';

  const filtrados = ORDERS.filter(o => enVista(o, vista));
  document.getElementById('lista').innerHTML = filtrados.length
    ? filtrados.map(tarjeta).join('')
    : `<div class="empty">${vista==='pendientes' ? 'No tenés nada pendiente. 👌' : 'Nada acá.'}</div>`;
}

function verVista(v){ vista = v; pintar(); }

// Agrupa por línea; los modelos quedan adentro para cuando quieras mirarlos.
function porLinea(items){
  const m = new Map();
  (items||[]).forEach(it => {
    const { linea, modelo } = splitNombre(it.name);
    if(!m.has(linea)) m.set(linea, { linea, qty:0, total:0, modelos:[] });
    const g = m.get(linea);
    const q = Math.max(1, parseInt(it.qty,10)||1);
    g.qty += q; g.total += q * (Number(it.price)||0);
    g.modelos.push({ modelo: it.sku || modelo, color: it.color || '', qty:q });
  });
  return [...m.values()].sort((a,b) => b.total - a.total);
}

function tarjeta(o){
  const p = paso(o);
  const info = PASOS[p];
  const d = new Date(o.created_at);
  const cuando = d.toLocaleDateString('es-AR', { day:'numeric', month:'long' });
  const unidades = (o.items||[]).reduce((a,it) => a + (parseInt(it.qty,10)||1), 0);
  const uTxt = unidades + (unidades === 1 ? ' anteojo' : ' anteojos');
  const sh = o.ship || {};
  const nombre = sh.razon_social || o.name || o.email;

  // La plata de la derecha: mientras no despachaste, el total. Después, lo que te deben.
  const plata = (p === 'despachado' || p === 'saldado')
    ? `<span class="big ${debe(o)>0?'debe':''}">${debe(o) > 0 ? fmt(debe(o)) : fmt(o.total)}</span>
       <span class="chico">${debe(o) > 0 ? 'te debe · de ' + fmt(o.total) : 'cobrado'}</span>`
    : `<span class="big">${fmt(o.total)}</span><span class="chico">${uTxt}</span>`;

  return `<div class="card ${p==='cancelado'||p==='saldado'?'mudo':''}" id="c${o.id}">
    <div class="chead">
      <div>
        <p class="cname">${esc(nombre)}</p>
        <p class="cmeta">#${o.id} · ${cuando}${p!=='despachado'&&p!=='saldado' ? '' : ' · ' + uTxt}</p>
      </div>
      <div class="cplata">${plata}</div>
    </div>

    <div class="paso"><span class="pt ${p}"></span>${info.txt}</div>

    <div class="acc">
      ${accionPrincipal(o, p)}
      <button class="b ico" onclick="verDetalle(${o.id})" title="Ver el pedido">${abiertos.has(o.id)?'▴':'▾'}</button>
      <div class="mas">
        <button class="b ico" onclick="abrirMenu(event,${o.id})" title="Más">⋯</button>
        <div class="menu" id="m${o.id}">${menu(o,p)}</div>
      </div>
    </div>

    <div id="d${o.id}">${abiertos.has(o.id) ? detalle(o) : ''}</div>
  </div>`;
}

function accionPrincipal(o, p){
  if(p === 'nuevo') return `<button class="b p" onclick="pasarAMartin(${o.id})">Pasar a Martín</button>`;
  if(p === 'pedido') return `<button class="b p" onclick="llegoTalCual(${o.id})">Llegó tal cual</button>
    <button class="b" onclick="modalRecibir(${o.id})">Vino distinto</button>`;
  if(p === 'recibido') return `<button class="b p" onclick="mover(${o.id},'despachado')">Despachado</button>
    <button class="b" onclick="etiqueta(${o.id})">Etiqueta</button>`;
  if(p === 'despachado') return `<button class="b p" onclick="cobrarTodo(${o.id})">Me pagó todo</button>
    <button class="b" onclick="modalPago(${o.id})">Una parte</button>`;
  return `<button class="b q" style="flex:1" onclick="verDetalle(${o.id})">Ver el pedido</button>`;
}

function menu(o, p){
  const atras = { pedido:'nuevo', recibido:'pedido', despachado:'recibido' }[p];
  const faltaCargar = !o.supplier_move_id && p !== 'nuevo' && p !== 'cancelado';
  return `
    ${faltaCargar ? `<button onclick="modalRecibir(${o.id})"><b>Cargar a la cuenta de Martín</b></button><hr>` : ''}
    <button onclick="pdfProveedor(${o.id})">PDF para Martín</button>
    <button onclick="pdfCliente(${o.id})">PDF para el cliente</button>
    <button onclick="etiqueta(${o.id})">Etiqueta de envío</button>
    <hr>
    <button onclick="editarItems(${o.id})">Editar el pedido</button>
    <button onclick="editarNota(${o.id})">${o.nota ? 'Cambiar la nota' : 'Agregar una nota'}</button>
    ${cobrado(o) ? `<button onclick="borrarPagos(${o.id})">Borrar los cobros</button>` : ''}
    ${atras ? `<button onclick="mover(${o.id},'${atras}')">Volver un paso atrás</button>` : ''}
    <hr>
    ${o.etapa === 'cancelado'
      ? `<button onclick="mover(${o.id},'nuevo')">Reactivar</button>`
      : `<button onclick="mover(${o.id},'cancelado')">Cancelar el pedido</button>`}
    <button class="mal" onclick="borrarPedido(${o.id})">Borrar</button>`;
}

function abrirMenu(ev, id){
  ev.stopPropagation();
  const m = document.getElementById('m'+id);
  const abierto = m.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open'));
  if(!abierto) m.classList.add('open');
}
document.addEventListener('click', () => document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open')));

/* ---------- detalle ---------- */
function verDetalle(id){
  const box = document.getElementById('d'+id);
  if(abiertos.has(id)){ abiertos.delete(id); box.innerHTML = ''; }
  else { abiertos.add(id); box.innerHTML = detalle(ORDERS.find(o => o.id === id)); }
  pintar();
}

function detalle(o){
  const sh = o.ship || {};
  const dir = sh.direccion || {};
  const lineas = porLinea(o.items);
  const p = paso(o);

  const pedido = `<div class="det"><h4>El pedido</h4>
    ${lineas.map(l => `<div class="ln"><span><b>${esc(l.linea)}</b> <span class="g">${l.qty} u.</span></span>
      <span class="num">${fmt(l.total)}</span></div>
      <div class="mod">${l.modelos.map(m => esc(m.modelo||'—') + (m.color?' '+esc(m.color):'') + ' ×' + m.qty).join(' · ')}</div>`).join('')}
    <div class="ln" style="border-top:1px solid var(--ln);margin-top:6px;padding-top:9px">
      <span><b>Total</b></span><span class="num"><b>${fmt(o.total)}</b></span></div></div>`;

  const guita = `<div class="det"><h4>Números</h4>
    <div class="dato"><span>Te van a pagar</span><span class="num">${fmt(o.total)}</span></div>
    <div class="dato"><span>Te cuesta</span><span class="num">${costo(o) ? fmt(costo(o)) : '—'}</span></div>
    ${o.costo_usd ? `<div class="dato"><span style="padding-left:12px">de Martín</span><span class="num">US$ ${Number(o.costo_usd).toFixed(2)}</span></div>` : ''}
    ${Number(o.costo_ars) ? `<div class="dato"><span style="padding-left:12px">de otros proveedores</span><span class="num">${fmt(o.costo_ars)}</span></div>` : ''}
    <div class="dato"><span>Te queda</span><span class="num"><b>${costo(o) ? fmt(ganancia(o)) + ' · ' + Math.round(ganancia(o)/o.total*100) + '%' : '—'}</b></span></div>
    ${cobrado(o) ? `<div class="dato"><span>Cobrado</span><span class="num">${fmt(cobrado(o))}</span></div>` : ''}
    ${debe(o) && (p==='despachado'||p==='saldado') ? `<div class="dato"><span>Te debe</span><span class="num debe"><b>${fmt(debe(o))}</b></span></div>` : ''}
    </div>`;

  const pagos = (o.pagos||[]).length ? `<div class="det"><h4>Cobros</h4>
    ${o.pagos.map(pg => `<div class="dato"><span>${fechaCorta(pg.fecha)}${pg.medio?' · '+esc(pg.medio):''}${pg.nota?' · '+esc(pg.nota):''}</span>
      <span class="num">${fmt(pg.monto)}</span></div>`).join('')}</div>` : '';

  const envio = sh.razon_social ? `<div class="det"><h4>Envío</h4>
    <div class="dato"><span>${esc(sh.razon_social)}</span><span>${esc(sh.dni_cuit||'')}</span></div>
    <div class="dato"><span>${esc(dir.texto||'—')}${dir.piso?' · '+esc(dir.piso):''}</span>
      <span>${sh.telefono?`<a href="https://wa.me/${String(sh.telefono).replace(/\D/g,'')}" target="_blank">${esc(sh.telefono)}</a>`:''}</span></div>
    </div>` : '<div class="det"><h4>Envío</h4><div class="dato"><span>Pedido viejo, sin datos de envío.</span></div></div>';

  const extra = (o.faltante ? `<div class="aviso">${esc(FALTANTE_TXT[o.faltante]||'')}</div>` : '')
    + (o.nota ? `<div class="aviso info">${esc(o.nota)}</div>` : '');

  return pedido + guita + pagos + envio + extra;
}

/* ---------- acciones ---------- */
async function post(body){ return api('/api/admin', { method:'POST', body: JSON.stringify(body) }); }

async function mover(id, etapa){
  if(etapa === 'cancelado' && !confirm('¿Cancelar el pedido #'+id+'?')) return;
  try{ await post({ id, etapa }); await cargar(); }catch(e){ alert(e.message); }
}

// "Pasar a Martín": baja el PDF y deja el pedido esperando.
async function pasarAMartin(id){
  pdfProveedor(id);
  try{ await post({ id, etapa:'pedido' }); await cargar(); showToast('Pedido #'+id+' a la espera de Martín'); }
  catch(e){ alert(e.message); }
}

async function llegoTalCual(id){
  const o = ORDERS.find(x => x.id === id);
  const u = (o.items||[]).reduce((a,it) => a + (parseInt(it.qty,10)||1), 0);
  if(!confirm(`Llegaron los ${u} anteojo${u===1?'':'s'} del pedido #${id} tal cual.\n\nSe le suma a la deuda de Martín.`)) return;
  try{
    const r = await post({ id, recibir:{} });
    await cargar();
    showToast(r.monto_usd ? 'Sumado a Martín: US$ ' + r.monto_usd.toFixed(2) : 'Recibido');
    if(r.sin_costo && r.sin_costo.length) alert('Ojo: no tengo el costo de ' + r.sin_costo.join(', ') + ', así que no entró en la deuda.');
  }catch(e){ alert(e.message); }
}

// Va cargando de a uno los pedidos que quedaron sin pasar a Martín.
function cargarPendientesMartin(){
  const pend = ORDERS.filter(o => !o.supplier_move_id &&
    ['recibido','despachado','saldado'].includes(paso(o)));
  if(!pend.length) return;
  window._enTanda = true;
  modalRecibir(pend[0].id, pend.length);
}

function modalRecibir(id, quedan){
  const o = ORDERS.find(x => x.id === id);
  const lineas = porLinea(o.items);
  const yaDespachado = paso(o) === 'despachado' || paso(o) === 'saldado';
  abrirModal(`
    <h3>${yaDespachado ? 'Cargar el pedido #' + id + ' a la cuenta de Martín' : '¿Qué te trajo Martín?'}</h3>
    <p class="sub">${yaDespachado
      ? 'Este ya lo retiraste y lo despachaste, pero nunca se le cargó. Confirmá las cantidades y va a su deuda.'
      : 'Dejá las que vinieron bien y corregí las que no. Solo cantidades por línea; los modelos no importan.'}
      ${quedan > 1 ? `<br><b>Quedan ${quedan} por cargar.</b>` : ''}</p>
    ${lineas.map((l,i) => `<div class="qrow" id="q${i}">
      <div><span class="qn">${esc(l.linea)}</span><span class="qg">pediste ${l.qty}</span></div>
      <input type="number" min="0" id="qi${i}" value="${l.qty}" data-pedido="${l.qty}" oninput="marcarDif(${i})">
    </div>`).join('')}
    <div class="qtot"><span>Total</span><span><span id="qTot">${lineas.reduce((a,l)=>a+l.qty,0)}</span> <span class="g">anteojos</span></span></div>
    <div class="mfoot">
      <button class="b q" onclick="cerrarModal()">Cancelar</button>
      <button class="b p" style="flex:none" onclick="guardarRecibido(${id})">Sumar a la deuda de Martín</button>
    </div>`);
  window._lineasRecibir = lineas;
}
function marcarDif(i){
  const inp = document.getElementById('qi'+i);
  document.getElementById('q'+i).classList.toggle('dif', Number(inp.value) !== Number(inp.dataset.pedido));
  let t = 0;
  (window._lineasRecibir||[]).forEach((l,k) => { t += Number(document.getElementById('qi'+k).value) || 0; });
  document.getElementById('qTot').textContent = t;
}
async function guardarRecibido(id){
  const lineas = (window._lineasRecibir||[]).map((l,i) =>
    ({ linea: l.linea, qty: Math.max(0, parseInt(document.getElementById('qi'+i).value,10) || 0) }));
  try{
    const r = await post({ id, recibir:{ lineas } });
    cerrarModal(); await cargar();
    showToast(r.monto_usd ? 'Sumado a Martín: US$ ' + r.monto_usd.toFixed(2) : 'Recibido');
    // Si venía de la carga en tanda, sigue con el que falte.
    const pend = ORDERS.filter(o => !o.supplier_move_id && ['recibido','despachado','saldado'].includes(paso(o)));
    if(window._enTanda && pend.length) return modalRecibir(pend[0].id, pend.length);
    window._enTanda = false;
  }catch(e){ alert(e.message); }
}

async function cobrarTodo(id){
  const o = ORDERS.find(x => x.id === id);
  if(!confirm(`¿Te pagó los ${fmt(debe(o))} que faltaban?`)) return;
  try{ await post({ id, pago:{ resto:true } }); await cargar(); showToast('Cobrado'); }
  catch(e){ alert(e.message); }
}

function modalPago(id){
  const o = ORDERS.find(x => x.id === id);
  abrirModal(`
    <h3>Cobro parcial</h3>
    <p class="sub">${esc((o.ship&&o.ship.razon_social) || o.name)} · te debe <b>${fmt(debe(o))}</b> de ${fmt(o.total)}.</p>
    <label>¿Cuánto te pagó?</label>
    <input type="number" id="pMonto" inputmode="numeric" placeholder="${debe(o)}">
    <div class="fila">
      <div><label>¿Cómo?</label>
        <select id="pMedio">
          <option>Transferencia</option><option>Efectivo</option><option>Cheque</option>
          <option>Echeq</option><option>Otro</option>
        </select></div>
      <div><label>Cuándo</label><input type="date" id="pFecha" value="${hoyISO()}"></div>
    </div>
    <label>Nota</label>
    <input type="text" id="pNota" placeholder="Cheque a 30 días, vence 20/9…">
    <div class="mfoot">
      <button class="b q" onclick="cerrarModal()">Cancelar</button>
      <button class="b p" style="flex:none" onclick="guardarPago(${id})">Registrar</button>
    </div>`);
}
async function guardarPago(id){
  const monto = Number(document.getElementById('pMonto').value);
  if(!(monto > 0)) return alert('Poné cuánto te pagó.');
  try{
    await post({ id, pago:{ monto, medio: document.getElementById('pMedio').value,
      nota: document.getElementById('pNota').value, fecha: document.getElementById('pFecha').value } });

  try{
    await post({ costmap:{ patron, articulo,
      factor: document.getElementById('cf'+i).value,
      costo_ars: document.getElementById('cp'+i) ? document.getElementById('cp'+i).value : 0 } });

/* ---------- editor de items ---------- */
function itemsToText(items){
  return (items||[]).map(it => `${it.name} | ${it.color || ''} | ${it.qty} | ${it.price}`).join('\n');
}
function textToItems(txt){
  const items = [], errores = [];
  String(txt||'').split(/\r?\n/).forEach((raw,i) => {
    const line = raw.trim(); if(!line) return;
    const p = line.split('|').map(x => x.trim());
    if(p.length < 4){ errores.push('Renglón '+(i+1)+': van 4 campos separados por |'); return; }
    const qty = parseInt(p[2],10), price = Number(String(p[3]).replace(/[^\d.-]/g,''));
    if(!p[0] || !(qty>0) || !isFinite(price)){ errores.push('Renglón '+(i+1)+': revisá los datos'); return; }
    const m = p[0].match(/\(([^)]+)\)\s*$/);
    items.push({ sku: m?m[1].trim():'', name:p[0], color:p[1]||null, qty, price });
  });
  if(!items.length && !errores.length) errores.push('No puede quedar vacío');
  return { items, errores };
}
function editarItems(id){
  const o = ORDERS.find(x => x.id === id);
  abrirModal(`<h3>Editar el pedido #${id}</h3>

    <textarea class="mono" id="iTxt" rows="11" spellcheck="false">${esc(itemsToText(o.items))}</textarea>
    <div class="mfoot"><button class="b q" onclick="cerrarModal()">Cancelar</button>
    <button class="b p" style="flex:none" onclick="guardarItems(${id})">Guardar</button></div>`);
}
async function guardarItems(id){
  const { items, errores } = textToItems(document.getElementById('iTxt').value);
  if(errores.length) return alert(errores.join('\n'));
  try{ await post({ id, items }); cerrarModal(); await cargar(); }catch(e){ alert(e.message); }
}
